<!-- @startingPoint section="Mobile Finance App" subtitle="Full interactive app recreation" viewport="400x820" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
body{margin:0;background:#EAEBF1;font-family:var(--font-sans);display:flex;align-items:center;justify-content:center;min-height:900px;padding:40px;box-sizing:border-box}
*{box-sizing:border-box}
::-webkit-scrollbar{display:none}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
</style>
</head><body>
<div id="root"></div>
<script id="app-src" type="text/plain">
const { useState, useEffect, useRef } = React;

/* ---- primitives (mirrors components/*) ---- */
function BalanceCard({ balance, masked, maskedText, cardNumber, expiry, onToggleMask }) {
  return (
    <div style={{ borderRadius: 22, padding: 22, color: '#fff', background: 'var(--gradient-balance)', boxShadow: 'var(--shadow-elevated)' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span style={{ fontSize: 12, fontWeight: 600, opacity: .8 }}>Số dư khả dụng</span>
        <div onClick={onToggleMask} style={{ cursor: 'pointer', width: 28, height: 28, borderRadius: '50%', background: 'rgba(255,255,255,.15)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <svg width="15" height="15" viewBox="0 0 20 14" fill="none"><path d="M1 7s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z" stroke="#fff" strokeWidth="1.4" /><circle cx="10" cy="7" r="2.5" stroke="#fff" strokeWidth="1.4" /></svg>
        </div>
      </div>
      <div style={{ fontSize: 30, fontWeight: 800, margin: '10px 0 18px' }}>{masked ? maskedText : balance}</div>
      <div style={{ display: 'flex', justifyContent: 'space-between' }}>
        <span style={{ fontSize: 14, letterSpacing: 2, fontWeight: 600, opacity: .9 }}>{cardNumber}</span>
        <span style={{ fontSize: 12, opacity: .75, fontWeight: 600 }}>{expiry}</span>
      </div>
    </div>
  );
}
function StatCard({ label, value, tone }) {
  return (
    <div style={{ flex: 1, background: '#fff', borderRadius: 14, padding: 14, boxShadow: 'var(--shadow-card)' }}>
      <div style={{ fontSize: 11, color: 'var(--color-text-muted)', fontWeight: 600, marginBottom: 6 }}>{label}</div>
      <div style={{ fontSize: 16, fontWeight: 800, color: tone === 'positive' ? 'var(--color-success)' : 'var(--color-danger)' }}>{value}</div>
    </div>
  );
}
const CATEGORY_COLORS = { income: 'var(--color-cat-income)', food: 'var(--color-cat-food)', shopping: 'var(--color-cat-shopping)', bills: 'var(--color-cat-bills)', transport: 'var(--color-cat-transport)' };
function CategoryIcon({ type }) {
  const c = { width: 18, height: 18, viewBox: '0 0 20 20', fill: 'none' };
  if (type === 'income') return <svg {...c}><path d="M10 15V5M10 5l-4 4M10 5l4 4" stroke="#fff" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" /></svg>;
  if (type === 'food') return <svg {...c}><path d="M6 2v6M8 2v6M6 5h2M7 8v10" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" /><path d="M13 2c-1.2 0-2 1.5-2 4s.8 3 2 3v9" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" /></svg>;
  if (type === 'shopping') return <svg {...c}><path d="M5 7h10l-1 10.5H6L5 7Z" stroke="#fff" strokeWidth="1.5" strokeLinejoin="round" /><path d="M8 7a2 2 0 0 1 4 0" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" /></svg>;
  if (type === 'bills') return <svg {...c}><rect x="5" y="2.5" width="10" height="15" rx="1.2" stroke="#fff" strokeWidth="1.5" /><path d="M7.5 7h5M7.5 10h5M7.5 13h3" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" /></svg>;
  if (type === 'transport') return <svg {...c}><path d="M4 12.5l1.2-4.3A2 2 0 0 1 7.1 6.8h5.8a2 2 0 0 1 1.9 1.4l1.2 4.3" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" /><rect x="3" y="12.5" width="14" height="3" rx="1" stroke="#fff" strokeWidth="1.5" /><circle cx="6.5" cy="16" r="1.1" fill="#fff" /><circle cx="13.5" cy="16" r="1.1" fill="#fff" /></svg>;
  return null;
}
function TransactionRow({ name, category, meta, amount, positive, icon, showDivider = true }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 0', borderBottom: showDivider ? '1px solid var(--divider)' : 'none' }}>
      <div style={{ width: 40, height: 40, borderRadius: '50%', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', background: CATEGORY_COLORS[icon] }}><CategoryIcon type={icon} /></div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 14, fontWeight: 700, color: 'var(--color-text)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{name}</div>
        <div style={{ fontSize: 12, color: 'var(--color-text-muted)', fontWeight: 600 }}>{category} · {meta}</div>
      </div>
      <div style={{ fontSize: 14, fontWeight: 800, color: positive ? 'var(--color-success)' : 'var(--color-danger)' }}>{amount}</div>
    </div>
  );
}
function GoalCard({ name, initials, color, due, percent, saved, target }) {
  return (
    <div style={{ background: '#fff', borderRadius: 18, padding: 16, boxShadow: 'var(--shadow-card)', marginBottom: 14 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12 }}>
        <div style={{ width: 40, height: 40, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontWeight: 800, fontSize: 12, background: color }}>{initials}</div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 14, fontWeight: 800 }}>{name}</div>
          <div style={{ fontSize: 11, color: 'var(--color-text-muted)', fontWeight: 600 }}>{due}</div>
        </div>
        <span style={{ fontSize: 13, fontWeight: 800 }}>{percent}%</span>
      </div>
      <div style={{ height: 6, borderRadius: 3, background: '#EDEEF3', marginBottom: 8 }}><div style={{ width: percent + '%', height: 6, borderRadius: 3, background: color }} /></div>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, fontWeight: 600, color: 'var(--color-text-muted)' }}><span>{saved} đã tiết kiệm</span><span>Mục tiêu {target}</span></div>
    </div>
  );
}
function BudgetRow({ category, spent, limit, percent, color }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, fontWeight: 700, marginBottom: 6 }}><span>{category}</span><span style={{ color: 'var(--color-text-muted)', fontWeight: 600 }}>{spent} / {limit}</span></div>
      <div style={{ height: 6, borderRadius: 3, background: '#EDEEF3' }}><div style={{ height: 6, borderRadius: 3, width: percent + '%', background: color }} /></div>
    </div>
  );
}
function SegmentedControl({ options, value, onChange }) {
  return (
    <div style={{ display: 'flex', gap: 6, background: '#EDEEF3', borderRadius: 10, padding: 4 }}>
      {options.map((opt) => { const active = opt === value; return <div key={opt} onClick={() => onChange(opt)} style={{ flex: 1, textAlign: 'center', padding: '9px 0', borderRadius: 10, cursor: 'pointer', background: active ? '#101828' : 'transparent', color: active ? '#fff' : '#8B93A7', fontWeight: active ? 700 : 600, fontSize: 13 }}>{opt}</div>; })}
    </div>
  );
}
function NavIcon({ type, color }) {
  const c = { width: 22, height: 22, viewBox: '0 0 22 22', fill: 'none' };
  if (type === 'overview') return <svg {...c}><circle cx="11" cy="11" r="7.5" stroke={color} strokeWidth="1.8" /><circle cx="11" cy="11" r="2.5" fill={color} /></svg>;
  if (type === 'list') return <svg {...c}><rect x="3" y="5" width="16" height="2.4" rx="1.2" fill={color} /><rect x="3" y="10" width="16" height="2.4" rx="1.2" fill={color} /><rect x="3" y="15" width="10" height="2.4" rx="1.2" fill={color} /></svg>;
  if (type === 'target') return <svg {...c}><circle cx="11" cy="11" r="8" stroke={color} strokeWidth="1.8" /><circle cx="11" cy="11" r="3.5" stroke={color} strokeWidth="1.8" /></svg>;
  if (type === 'profile') return <svg {...c}><circle cx="11" cy="7.5" r="3.5" stroke={color} strokeWidth="1.8" /><path d="M3.5 19c1.3-4 4.3-6 7.5-6s6.2 2 7.5 6" stroke={color} strokeWidth="1.8" strokeLinecap="round" /></svg>;
  return null;
}
function BottomNav({ items, activeKey, onChange, onAdd }) {
  const NavItem = ({ it }) => { const active = it.key === activeKey; return <div onClick={() => onChange(it.key)} style={{ cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, width: 56 }}><NavIcon type={it.icon} color={active ? '#2F6FED' : '#B4BACB'} /><span style={{ fontSize: 10, fontWeight: 700, color: active ? '#101828' : '#9AA1B4' }}>{it.label}</span></div>; };
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-around', padding: '10px 8px 26px', background: '#fff', borderTop: '1px solid var(--divider)' }}>
      {items.slice(0, 2).map((it) => <NavItem key={it.key} it={it} />)}
      <div onClick={onAdd} style={{ cursor: 'pointer', width: 52, height: 52, borderRadius: '50%', background: '#101828', display: 'flex', alignItems: 'center', justifyContent: 'center', marginTop: -30, boxShadow: '0 8px 16px rgba(16,24,40,.25)' }}><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 3v14M3 10h14" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" /></svg></div>
      {items.slice(2).map((it) => <NavItem key={it.key} it={it} />)}
    </div>
  );
}
function SettingsList({ items }) {
  return (
    <div style={{ background: '#fff', borderRadius: 26, overflow: 'hidden' }}>
      {items.map((item, i) => (
        <div key={item.label} style={{ display: 'flex', alignItems: 'center', minHeight: 52, padding: '0 16px', fontSize: 17, borderBottom: i < items.length - 1 ? '1px solid rgba(60,60,67,.12)' : 'none' }}>
          <div style={{ width: 30, height: 30, borderRadius: 7, background: item.iconColor, marginRight: 12 }} />
          <div style={{ flex: 1, color: 'var(--color-text)' }}>{item.label}</div>
          <svg width="8" height="14" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke="rgba(60,60,67,.3)" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" /></svg>
        </div>
      ))}
    </div>
  );
}

/* ---- data ---- */
const INITIAL_TX = [
  { id: 1, name: 'Lương tháng 8', category: 'Thu nhập', time: '07:00', amount: '+18.000.000 ₫', positive: true, icon: 'income', group: 'Hôm nay' },
  { id: 2, name: 'Circle K', category: 'Ăn uống', time: '08:30', amount: '-45.000 ₫', positive: false, icon: 'food', group: 'Hôm nay' },
  { id: 3, name: 'Highlands Coffee', category: 'Ăn uống', time: '15:40', amount: '-89.000 ₫', positive: false, icon: 'food', group: 'Hôm qua' },
  { id: 4, name: 'Shopee', category: 'Mua sắm', time: '21:15', amount: '-650.000 ₫', positive: false, icon: 'shopping', group: 'Hôm qua' },
];
const GOALS = [
  { name: 'Mua xe máy', initials: 'XM', color: '#F2734A', due: 'Hạn: Th12/2026', percent: 50, saved: '15.000.000 ₫', target: '30.000.000 ₫' },
  { name: 'Du lịch Đà Lạt', initials: 'DL', color: '#2F6FED', due: 'Hạn: Th10/2026', percent: 52, saved: '4.200.000 ₫', target: '8.000.000 ₫' },
];
const BUDGETS = [
  { category: 'Mua sắm', spent: '650.000 ₫', limit: '2.000.000 ₫', percent: 33, color: '#7C5CFC' },
  { category: 'Ăn uống', spent: '134.000 ₫', limit: '1.500.000 ₫', percent: 9, color: '#F2734A' },
];
const NAV_ITEMS = [
  { key: 'overview', label: 'Tổng quan', icon: 'overview' },
  { key: 'transactions', label: 'Giao dịch', icon: 'list' },
  { key: 'goals', label: 'Mục tiêu', icon: 'target' },
  { key: 'profile', label: 'Cá nhân', icon: 'profile' },
];

function App() {
  const [authed, setAuthed] = useState(false);
  const [tab, setTab] = useState('overview');
  const [masked, setMasked] = useState(false);
  const [txs, setTxs] = useState(INITIAL_TX);
  const [filter, setFilter] = useState('Tất cả');
  const [adding, setAdding] = useState(false);
  const [newType, setNewType] = useState('Chi tiêu');
  const amountRef = useRef(); const noteRef = useRef();
  const [category, setCategory] = useState('Ăn uống');

  useEffect(() => { const t = setTimeout(() => setAuthed(true), 1600); return () => clearTimeout(t); }, [authed === false]);

  function save() {
    const raw = amountRef.current.value.replace(/\D/g, '');
    if (!raw) return;
    const positive = newType === 'Thu nhập';
    const cat = positive ? 'Thu nhập' : category;
    const iconMap = { 'Ăn uống': 'food', 'Mua sắm': 'shopping', 'Hóa đơn': 'bills', 'Di chuyển': 'transport', 'Thu nhập': 'income' };
    setTxs([{ id: Date.now(), name: noteRef.current.value || cat, category: cat, time: 'Vừa xong', amount: (positive ? '+' : '-') + Number(raw).toLocaleString('vi-VN') + ' ₫', positive, icon: iconMap[cat], group: 'Hôm nay' }, ...txs]);
    setAdding(false); setTab('overview');
  }

  const filtered = txs.filter(t => filter === 'Tất cả' ? true : filter === 'Thu nhập' ? t.positive : !t.positive);

  return (
    <div style={{ width: 390, height: 844, borderRadius: 48, overflow: 'hidden', background: '#F4F5FA', boxShadow: '0 40px 80px rgba(0,0,0,.18)', position: 'relative', display: 'flex', flexDirection: 'column' }}>
      {!authed && (
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{ width: 72, height: 72, borderRadius: 22, background: 'var(--color-primary)', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 18 }}>
            <svg width="34" height="34" viewBox="0 0 30 30" fill="none"><circle cx="15" cy="15" r="10" stroke="#fff" strokeWidth="2.2" /><path d="M15 10v10M11 13h5.5a2 2 0 1 1 0 4H11" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" /></svg>
          </div>
          <div style={{ fontSize: 26, fontWeight: 800 }}>Vela</div>
          <div style={{ fontSize: 13, color: 'var(--color-text-muted)', fontWeight: 600, marginBottom: 28 }}>Quản lý tài chính thông minh</div>
          <div style={{ display: 'flex', gap: 6 }}>
            {[0, .15, .3].map(d => <div key={d} style={{ width: 7, height: 7, borderRadius: 4, background: 'var(--color-primary)', animation: 'pulse 1.1s ease-in-out ' + d + 's infinite' }} />)}
          </div>
        </div>
      )}
      {authed && (
        <React.Fragment>
          <div style={{ flex: 1, overflow: 'auto', padding: '24px 20px 24px' }}>
            {adding && (
              <div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 22 }}>
                  <div onClick={() => setAdding(false)} style={{ cursor: 'pointer', width: 36, height: 36, borderRadius: 18, background: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: 'var(--shadow-card)' }}>
                    <svg width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="M7.5 1.5l-6 6 6 6" stroke="#101828" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" /></svg>
                  </div>
                  <span style={{ fontSize: 18, fontWeight: 800 }}>Thêm giao dịch</span>
                </div>
                <div style={{ marginBottom: 20 }}><SegmentedControl options={['Chi tiêu', 'Thu nhập']} value={newType} onChange={setNewType} /></div>
                <div style={{ background: '#fff', borderRadius: 18, padding: 18, boxShadow: 'var(--shadow-card)', marginBottom: 16 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--color-text-muted)', marginBottom: 8 }}>Số tiền</div>
                  <input ref={amountRef} type="text" inputMode="numeric" placeholder="0 ₫" style={{ width: '100%', border: 'none', outline: 'none', fontSize: 26, fontWeight: 800 }} />
                </div>
                {newType === 'Chi tiêu' && (
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 16 }}>
                    {['Ăn uống', 'Mua sắm', 'Hóa đơn', 'Di chuyển', 'Khác'].map(c => (
                      <div key={c} onClick={() => setCategory(c)} style={{ padding: '8px 14px', borderRadius: 10, cursor: 'pointer', fontSize: 12, fontWeight: 700, background: category === c ? '#101828' : '#EDEEF3', color: category === c ? '#fff' : '#8B93A7' }}>{c}</div>
                    ))}
                  </div>
                )}
                <div style={{ background: '#fff', borderRadius: 18, padding: 18, boxShadow: 'var(--shadow-card)', marginBottom: 22 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--color-text-muted)', marginBottom: 8 }}>Ghi chú</div>
                  <input ref={noteRef} type="text" placeholder="Ví dụ: Ăn trưa" style={{ width: '100%', border: 'none', outline: 'none', fontSize: 14, fontWeight: 600 }} />
                </div>
                <div onClick={save} style={{ cursor: 'pointer', textAlign: 'center', padding: 15, borderRadius: 14, background: '#101828', color: '#fff', fontSize: 15, fontWeight: 800 }}>Lưu giao dịch</div>
              </div>
            )}

            {!adding && tab === 'overview' && (
              <div>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <div style={{ width: 42, height: 42, borderRadius: 21, background: 'var(--color-primary)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: 14 }}>MA</div>
                    <div><div style={{ fontSize: 13, color: 'var(--color-text-muted)', fontWeight: 600 }}>Xin chào,</div><div style={{ fontSize: 16, fontWeight: 800 }}>Minh Anh</div></div>
                  </div>
                </div>
                <BalanceCard balance="24.850.000 ₫" masked={masked} maskedText="•• ••• •••₫" cardNumber="•••• 4821" expiry="09/28" onToggleMask={() => setMasked(!masked)} />
                <div style={{ display: 'flex', gap: 12, margin: '20px 0' }}>
                  <StatCard label="Thu nhập tháng này" value="+18.200.000 ₫" tone="positive" />
                  <StatCard label="Chi tiêu tháng này" value="-6.350.000 ₫" tone="negative" />
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 12 }}><span style={{ fontSize: 15, fontWeight: 800 }}>Giao dịch gần đây</span><span onClick={() => setTab('transactions')} style={{ fontSize: 13, fontWeight: 700, color: 'var(--color-primary)', cursor: 'pointer' }}>Xem tất cả</span></div>
                <div style={{ background: '#fff', borderRadius: 18, padding: '4px 16px', boxShadow: 'var(--shadow-card)' }}>
                  {txs.slice(0, 4).map((t, i, arr) => <TransactionRow key={t.id} {...t} showDivider={i < arr.length - 1} />)}
                </div>
                <div style={{ margin: '20px 0 12px', fontSize: 15, fontWeight: 800 }}>Ngân sách theo danh mục</div>
                <div style={{ background: '#fff', borderRadius: 18, padding: 16, boxShadow: 'var(--shadow-card)' }}>
                  {BUDGETS.map(b => <BudgetRow key={b.category} {...b} />)}
                </div>
              </div>
            )}

            {!adding && tab === 'transactions' && (
              <div>
                <div style={{ fontSize: 24, fontWeight: 800, marginBottom: 16 }}>Giao dịch</div>
                <div style={{ marginBottom: 18 }}><SegmentedControl options={['Tất cả', 'Thu nhập', 'Chi tiêu']} value={filter} onChange={setFilter} /></div>
                <div style={{ background: '#fff', borderRadius: 18, padding: '4px 16px', boxShadow: 'var(--shadow-card)' }}>
                  {filtered.map((t, i, arr) => <TransactionRow key={t.id} {...t} showDivider={i < arr.length - 1} />)}
                </div>
              </div>
            )}

            {!adding && tab === 'goals' && (
              <div>
                <div style={{ fontSize: 24, fontWeight: 800, marginBottom: 18 }}>Mục tiêu</div>
                {GOALS.map(g => <GoalCard key={g.name} {...g} />)}
              </div>
            )}

            {!adding && tab === 'profile' && (
              <div>
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '12px 0 22px' }}>
                  <div style={{ width: 76, height: 76, borderRadius: 38, background: 'var(--color-primary)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: 24, marginBottom: 12 }}>MA</div>
                  <div style={{ fontSize: 18, fontWeight: 800 }}>Minh Anh</div>
                  <div style={{ fontSize: 13, color: 'var(--color-text-muted)', fontWeight: 600 }}>minhanh@gmail.com</div>
                </div>
                <SettingsList items={[{ label: 'Thông tin cá nhân', iconColor: '#2F6FED' }, { label: 'Bảo mật & mật khẩu', iconColor: '#101828' }, { label: 'Trợ giúp', iconColor: '#7C5CFC' }]} />
                <div onClick={() => { setAuthed(false); setTab('overview'); }} style={{ cursor: 'pointer', textAlign: 'center', marginTop: 18, padding: 14, fontSize: 14, fontWeight: 700, color: 'var(--color-danger)' }}>Đăng xuất</div>
              </div>
            )}
          </div>
          <BottomNav items={NAV_ITEMS} activeKey={tab} onChange={(k) => { setTab(k); setAdding(false); }} onAdd={() => setAdding(true)} />
        </React.Fragment>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
const __code = document.getElementById("app-src").textContent;
const __out = Babel.transform(__code, { presets: [["react", { runtime: "classic" }]] }).code;
(0, eval)(__out);
</script>
</body></html>
