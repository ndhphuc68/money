<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Card, pill, and circle corner radii" name="Radius Scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-sans);background:#fff;padding:20px;display:flex;gap:20px;align-items:flex-end}
.box{background:var(--color-primary);width:70px;height:70px;display:flex;align-items:flex-end;justify-content:center;color:#fff;font-size:10px;font-family:monospace;padding-bottom:6px}
</style></head><body>
<div class="box" style="border-radius:var(--radius-sm)">sm 10</div>
<div class="box" style="border-radius:var(--radius-md)">md 14</div>
<div class="box" style="border-radius:var(--radius-lg)">lg 18</div>
<div class="box" style="border-radius:var(--radius-xl)">xl 22</div>
<div class="box" style="border-radius:var(--radius-circle)">circle</div>
<div class="box" style="border-radius:var(--radius-pill);width:110px">pill</div>
</body></html>
