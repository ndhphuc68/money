<!-- @dsCard group="Spacing" viewport="700x180" subtitle="4px base scale" name="Spacing Scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-sans);background:#fff;padding:20px}
.row{display:flex;align-items:center;gap:12px;padding:6px 0}
.bar{background:var(--color-primary);height:14px;border-radius:3px}
.tag{font-size:11px;font-family:monospace;width:110px;color:var(--color-text-muted)}
</style></head><body>
<div class="row"><span class="tag">--space-1 / 4px</span><div class="bar" style="width:4px"></div></div>
<div class="row"><span class="tag">--space-2 / 8px</span><div class="bar" style="width:8px"></div></div>
<div class="row"><span class="tag">--space-3 / 12px</span><div class="bar" style="width:12px"></div></div>
<div class="row"><span class="tag">--space-4 / 16px</span><div class="bar" style="width:16px"></div></div>
<div class="row"><span class="tag">--space-5 / 20px</span><div class="bar" style="width:20px"></div></div>
<div class="row"><span class="tag">--space-6 / 24px</span><div class="bar" style="width:24px"></div></div>
<div class="row"><span class="tag">--space-7 / 32px</span><div class="bar" style="width:32px"></div></div>
</body></html>
