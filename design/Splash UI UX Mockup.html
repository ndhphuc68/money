<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vimo Splash UI UX Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 24% 18%, rgba(47, 111, 237, 0.14), transparent 28%),
        linear-gradient(145deg, #eef2f8 0%, #f7f9fc 48%, #e7ebf3 100%);
      color: #101828;
      font-family: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .stage {
      width: min(100%, 860px);
      display: grid;
      gap: 24px;
      justify-items: center;
    }

    .label {
      width: min(100%, 402px);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      color: #667085;
      font-size: 13px;
      font-weight: 700;
    }

    .label strong {
      color: #101828;
      font-size: 15px;
      font-weight: 800;
    }

    .phone {
      width: 402px;
      max-width: calc(100vw - 32px);
      aspect-ratio: 402 / 874;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(16, 24, 40, 0.14);
      border-radius: 44px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(249, 251, 255, 0.96)),
        #f8fafc;
      box-shadow: 0 28px 70px rgba(16, 24, 40, 0.18);
    }

    .status {
      height: 54px;
      padding: 18px 34px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      color: #030712;
      font-size: 16px;
      font-weight: 800;
      line-height: 1;
    }

    .notch {
      position: absolute;
      top: 12px;
      left: 50%;
      width: 126px;
      height: 38px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #000;
    }

    .status-icons {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .signal {
      display: grid;
      grid-template-columns: repeat(4, 3px);
      gap: 2px;
      align-items: end;
      height: 14px;
    }

    .signal span {
      width: 3px;
      border-radius: 2px;
      background: #020617;
    }

    .signal span:nth-child(1) { height: 5px; }
    .signal span:nth-child(2) { height: 8px; }
    .signal span:nth-child(3) { height: 11px; }
    .signal span:nth-child(4) { height: 14px; }

    .wifi {
      width: 17px;
      height: 12px;
      border: 3px solid #020617;
      border-bottom: 0;
      border-left-color: transparent;
      border-right-color: transparent;
      border-radius: 16px 16px 0 0;
      position: relative;
    }

    .wifi:after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -4px;
      width: 4px;
      height: 4px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #020617;
    }

    .battery {
      width: 24px;
      height: 12px;
      border: 1.8px solid #020617;
      border-radius: 4px;
      padding: 2px;
      position: relative;
    }

    .battery:before {
      content: "";
      display: block;
      width: 15px;
      height: 100%;
      border-radius: 2px;
      background: #020617;
    }

    .battery:after {
      content: "";
      position: absolute;
      right: -4px;
      top: 3px;
      width: 2px;
      height: 6px;
      border-radius: 0 2px 2px 0;
      background: #020617;
    }

    .splash {
      min-height: calc(100% - 54px);
      padding: 48px 32px 28px;
      display: grid;
      grid-template-rows: 1fr auto;
    }

    .brand {
      display: grid;
      place-items: center;
      align-content: center;
      text-align: center;
      transform: translateY(-8px);
    }

    .mark-wrap {
      position: relative;
      width: min(170px, 88vw);
      height: min(170px, 88vw);
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      animation: rise 620ms ease-out both;
    }

    .mark {
      position: relative;
      width: min(150px, 76vw);
      height: min(150px, 76vw);
      object-fit: contain;
    }

    .app-name {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: 0;
      color: #101828;
      animation: fade-up 560ms ease-out 120ms both;
    }

    .tagline {
      max-width: 250px;
      margin: 10px auto 0;
      color: #667085;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.55;
      animation: fade-up 560ms ease-out 220ms both;
    }

    .footer {
      display: grid;
      justify-items: center;
      gap: 18px;
    }

    .loader {
      width: 116px;
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5e7ef;
    }

    .loader span {
      display: block;
      width: 46px;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2f6fed, #15b79e);
      animation: loading 1250ms ease-in-out infinite;
    }

    .ready {
      min-height: 20px;
      color: #98a2b3;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      animation: fade-in 700ms ease-out 520ms both;
    }

    .home-indicator {
      width: 132px;
      height: 5px;
      border-radius: 999px;
      background: #111827;
      opacity: 0.2;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes loading {
      0% { transform: translateX(-52px); }
      50% { transform: translateX(42px); }
      100% { transform: translateX(122px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *:before,
      *:after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    @media (max-width: 460px) {
      body {
        padding: 16px;
      }

      .label {
        padding: 0 6px;
      }

      .phone {
        border-radius: 38px;
      }

      .splash {
        padding-inline: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Vimo splash screen mockup">
    <div class="label">
      <strong>0. Splash</strong>
      <span>Polished UI/UX mockup</span>
    </div>

    <section class="phone" aria-label="iPhone preview">
      <div class="notch" aria-hidden="true"></div>

      <div class="status" aria-hidden="true">
        <span>9:41</span>
        <div class="status-icons">
          <div class="signal"><span></span><span></span><span></span><span></span></div>
          <div class="wifi"></div>
          <div class="battery"></div>
        </div>
      </div>

      <div class="splash">
        <div class="brand">
          <div class="mark-wrap">
            <img class="mark" src="./uploads/vimo-icon.png" alt="Vimo">
          </div>
          <h1 class="app-name">Vimo</h1>
          <p class="tagline">Quản lý tài chính rõ ràng, sống an tâm mỗi ngày.</p>
        </div>

        <div class="footer">
          <div class="loader" aria-label="Đang tải">
            <span></span>
          </div>
          <div class="ready">Đang chuẩn bị dữ liệu</div>
          <div class="home-indicator" aria-hidden="true"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
