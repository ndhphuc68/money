<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
          rel="stylesheet" />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #2f6fed;
            text-decoration: none;
          }
          a:hover {
            color: #1b4fc0;
          }
          * {
            box-sizing: border-box;
            font-family: 'Manrope', system-ui, sans-serif;
          }
          ::-webkit-scrollbar {
            display: none;
          }
        </style>
      </helmet>

      <div
        style="
          min-height: 100vh;
          background: #eaebf1;
          padding: 48px;
          display: flex;
          flex-direction: column;
          gap: 8px;
        ">
        <div style="font-size: 22px; font-weight: 800; color: #101828; margin-bottom: 4px">
          Tất cả màn hình — Vimo
        </div>
        <div style="font-size: 14px; color: #8b93a7; font-weight: 600; margin-bottom: 8px">
          Mỗi khung cố định ở một màn để tiện xem và code riêng lẻ.
        </div>

        <sc-for list="{{groups}}" as="group" hint-placeholder-count="3">
          <div style="margin-top: 24px">
            <div style="font-size: 15px; font-weight: 800; color: #101828; margin-bottom: 16px">
              {{group.title}}
            </div>
            <div style="display: flex; gap: 32px; flex-wrap: wrap">
              <sc-for list="{{group.screens}}" as="screen" hint-placeholder-count="4">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
                  <div style="font-size: 14px; font-weight: 800; color: #101828">
                    {{screen.label}}
                  </div>
                  <sc-if value="{{screen.isFinanceApp}}">
                    <dc-import
                      name="Finance App"
                      start-logged-in="{{screen.startLoggedIn}}"
                      force-onboarding="{{screen.forceOnboarding}}"
                      onboarding-start-step="{{screen.onboardingStartStep}}"
                      initial-tab="{{screen.initialTab}}"
                      force-add-tx="{{screen.forceAddTx}}"
                      force-splash="{{screen.forceSplash}}"
                      initial-recurring-view="{{screen.initialRecurringView}}"
                      hint-size="402,874"></dc-import>
                  </sc-if>
                  <sc-if value="{{screen.isGoldProfile}}">
                    <dc-import
                      name="Finance App.gold"
                      start-logged-in="{{screen.startLoggedIn}}"
                      initial-tab="{{screen.initialTab}}"
                      hint-size="402,874"></dc-import>
                  </sc-if>
                  <sc-if value="{{screen.isGoldManagement}}">
                    <dc-import name="Finance App.gold-management" hint-size="402,874"></dc-import>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script>
      class Component extends DCLogic {
        renderVals() {
          return {
            groups: [
              {
                title: 'Splash & Onboarding',
                screens: [
                  { label: '0. Splash', isFinanceApp: true, startLoggedIn: false, forceOnboarding: false, forceSplash: true },
                  { label: '1. Tên người dùng', isFinanceApp: true, forceOnboarding: true, onboardingStartStep: '1' },
                  { label: '2. Tạo ví đầu tiên', isFinanceApp: true, forceOnboarding: true, onboardingStartStep: '2' },
                  { label: '3. Số dư ban đầu', isFinanceApp: true, forceOnboarding: true, onboardingStartStep: '3' },
                  { label: '4. Danh mục mặc định', isFinanceApp: true, forceOnboarding: true, onboardingStartStep: '4' },
                ],
              },
              {
                title: 'Màn hình chính',
                screens: [
                  { label: 'Tổng quan', isFinanceApp: true, startLoggedIn: true, initialTab: 'overview' },
                  { label: 'Giao dịch', isFinanceApp: true, startLoggedIn: true, initialTab: 'transactions' },
                  { label: 'Mục tiêu', isFinanceApp: true, startLoggedIn: true, initialTab: 'goals' },
                  { label: 'Cài đặt', isGoldProfile: true, startLoggedIn: true, initialTab: 'profile' },
                  { label: 'Quản lý vàng', isGoldManagement: true },
                ],
              },
              {
                title: 'Chi tiêu định kỳ',
                screens: [
                  { label: 'Danh sách kỳ', isFinanceApp: true, startLoggedIn: true, initialRecurringView: 'list' },
                  { label: 'Chi tiết kỳ', isFinanceApp: true, startLoggedIn: true, initialRecurringView: 'detail' },
                  { label: 'Phạm vi cập nhật', isFinanceApp: true, startLoggedIn: true, initialRecurringView: 'scope' },
                  { label: 'Xác nhận thành công', isFinanceApp: true, startLoggedIn: true, initialRecurringView: 'success' },
                ],
              },
              {
                title: 'Khác',
                screens: [
                  { label: 'Thêm giao dịch', isFinanceApp: true, startLoggedIn: true, forceAddTx: true },
                ],
              },
            ],
          };
        }
      }
    </script>
  </body>
</html>
