<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vimo — Chi tiêu định kỳ: Danh sách kỳ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #eaebf1;
        font-family:
          'Manrope',
          system-ui,
          -apple-system,
          sans-serif;
        color: #101828;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      * {
        box-sizing: border-box;
      }
      ::-webkit-scrollbar {
        display: none;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      .phone-frame {
        width: 402px;
        height: 874px;
        background: #f4f5fa;
        border-radius: 44px;
        box-shadow: 0 24px 60px rgba(16, 24, 40, 0.18);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 8px solid #1e232a;
      }
      .status-bar {
        height: 48px;
        padding: 14px 24px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 800;
        color: #101828;
        z-index: 10;
        flex: none;
      }
      .screen-content {
        flex: 1;
        overflow: auto;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .asset-shortcut {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        border: 0;
        margin: 0;
        font: inherit;
        text-align: left;
        transition:
          background-color 120ms ease,
          box-shadow 120ms ease;
      }
      .asset-shortcut:hover {
        background: #fafbfc !important;
      }
      .asset-shortcut:active {
        background: #f2f4f7 !important;
        box-shadow: 0 1px 4px rgba(16, 24, 40, 0.08) !important;
      }
      .gold-control {
        appearance: none;
        -webkit-appearance: none;
        border: 0;
        margin: 0;
        font: inherit;
        text-align: inherit;
        color: inherit;
        transition: opacity 120ms ease;
      }
      .gold-control:active {
        opacity: 0.72;
      }
      @keyframes vela-pulse {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes vimo-rise {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes vimo-fade-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes vimo-loading {
        0% {
          transform: translateX(-52px);
        }
        50% {
          transform: translateX(42px);
        }
        100% {
          transform: translateX(122px);
        }
      }
    </style>
  </head>
  <body>
    <div class="phone-frame">
      <div class="status-bar">
        <span>9:41</span>
        <div style="display: flex; gap: 6px; align-items: center">
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none">
            <rect width="3" height="4" rx="0.5" y="7" fill="#101828" />
            <rect width="3" height="6" rx="0.5" x="4" y="5" fill="#101828" />
            <rect width="3" height="8" rx="0.5" x="8" y="3" fill="#101828" />
            <rect width="3" height="11" rx="0.5" x="12" fill="#101828" />
          </svg>
          <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
            <path d="M7.5 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z" fill="#101828" />
            <path
              d="M4.3 6.8a4.5 4.5 0 0 1 6.4 0"
              stroke="#101828"
              stroke-width="1.2"
              stroke-linecap="round" />
            <path
              d="M2.1 4.6a7.5 7.5 0 0 1 10.8 0"
              stroke="#101828"
              stroke-width="1.2"
              stroke-linecap="round" />
          </svg>
          <svg width="22" height="11" viewBox="0 0 22 11" fill="none">
            <rect x="0.5" y="0.5" width="18" height="10" rx="2.5" stroke="#101828" />
            <rect x="2" y="2" width="13" height="7" rx="1.5" fill="#101828" />
            <path d="M20 4v3" stroke="#101828" stroke-linecap="round" />
          </svg>
        </div>
      </div>
      <div class="screen-content">
        <div
          style="
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #f4f5fa;
            position: relative;
          ">
          <div style="flex: 1; overflow: auto; padding: 10px 20px 100px">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 18px">
              <a
                href="08-settings.html"
                style="
                  width: 40px;
                  height: 40px;
                  border: 0;
                  border-radius: 20px;
                  background: #fff;
                  box-shadow: 0 2px 8px rgba(16, 24, 40, 0.06);
                  cursor: pointer;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  text-decoration: none;
                ">
                <svg width="9" height="15" viewBox="0 0 9 15" fill="none">
                  <path
                    d="M7.5 1.5l-6 6 6 6"
                    stroke="#101828"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>
              </a>
              <div style="flex: 1">
                <div style="font-size: 20px; font-weight: 800">Chi tiêu định kỳ</div>
                <div style="font-size: 11px; color: #8b93a7; font-weight: 600; margin-top: 2px">
                  Kỳ dự kiến không tính vào số dư
                </div>
              </div>
            </div>

            <div style="display: flex; gap: 8px; margin-bottom: 16px">
              <span
                style="
                  padding: 8px 12px;
                  border-radius: 99px;
                  background: #dfe8ff;
                  color: #2f6fed;
                  font-size: 11px;
                  font-weight: 800;
                "
                >Sắp tới 2</span
              >
              <span
                style="
                  padding: 8px 12px;
                  border-radius: 99px;
                  background: #fee4e2;
                  color: #b42318;
                  font-size: 11px;
                  font-weight: 800;
                "
                >Quá hạn 1</span
              >
            </div>

            <div
              style="
                font-size: 12px;
                font-weight: 800;
                color: #8b93a7;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                margin: 14px 2px 8px;
              ">
              Cần xử lý
            </div>

            <a
              href="11-recurring-detail.html"
              style="
                width: 100%;
                border: 0;
                background: #fff;
                border-radius: 18px;
                padding: 14px 16px;
                box-shadow: 0 2px 10px rgba(16, 24, 40, 0.05);
                display: flex;
                align-items: center;
                gap: 12px;
                text-align: left;
                cursor: pointer;
                text-decoration: none;
                color: inherit;
                box-sizing: border-box;
              ">
              <div
                style="
                  width: 42px;
                  height: 42px;
                  border-radius: 21px;
                  background: #2f6fed;
                  color: #fff;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-size: 11px;
                  font-weight: 800;
                  flex: none;
                ">
                HĐ
              </div>
              <div style="flex: 1">
                <div style="font-size: 14px; font-weight: 800">YouTube Premium</div>
                <div style="font-size: 11px; color: #8b93a7; font-weight: 600; margin-top: 3px">
                  Đến hạn hôm qua · Ví chính
                </div>
                <span
                  style="
                    display: inline-flex;
                    margin-top: 6px;
                    padding: 4px 8px;
                    border-radius: 99px;
                    background: #fee4e2;
                    color: #b42318;
                    font-size: 10px;
                    font-weight: 800;
                  "
                  >Quá hạn</span
                >
              </div>
              <div style="font-size: 13px; font-weight: 800">179.000 ₫ ›</div>
            </a>

            <div
              style="
                font-size: 12px;
                font-weight: 800;
                color: #8b93a7;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                margin: 20px 2px 8px;
              ">
              Sắp tới
            </div>
            <div
              style="
                background: #fff;
                border-radius: 18px;
                padding: 4px 16px;
                box-shadow: 0 2px 10px rgba(16, 24, 40, 0.05);
              ">
              <div style="padding: 12px 0; display: flex; align-items: center; gap: 12px">
                <div
                  style="
                    width: 40px;
                    height: 40px;
                    border-radius: 20px;
                    background: #7c5cfc;
                    color: #fff;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 10px;
                    font-weight: 800;
                  ">
                  HĐ
                </div>
                <div style="flex: 1">
                  <div style="font-size: 14px; font-weight: 800">Shopee VIP</div>
                  <div style="font-size: 11px; color: #8b93a7; font-weight: 600">
                    3 thg 9 · Còn 6 ngày
                  </div>
                </div>
                <b style="font-size: 13px">29.000 ₫</b>
              </div>
            </div>
          </div>

          <div
            style="
              position: absolute;
              left: 0;
              right: 0;
              bottom: 0;
              padding: 12px 20px 34px;
              background: linear-gradient(180deg, rgba(244, 245, 250, 0) 0%, #f4f5fa 22%);
              z-index: 8;
            ">
            <a
              href="14-add-transaction.html"
              style="
                width: 100%;
                min-height: 60px;
                border: 0;
                border-radius: 16px;
                padding: 12px 16px;
                background: #101828;
                color: #fff;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                box-shadow: 0 8px 18px rgba(16, 24, 40, 0.16);
                cursor: pointer;
                text-align: left;
                text-decoration: none;
                box-sizing: border-box;
              ">
              <div>
                <div style="font-size: 14px; line-height: 20px; font-weight: 800">
                  Thêm chi tiêu định kỳ
                </div>
                <div
                  style="
                    font-size: 12px;
                    line-height: 17px;
                    color: #d0d5dd;
                    margin-top: 4px;
                    font-weight: 600;
                  ">
                  Tạo khoản chi và lịch cho các kỳ tiếp theo
                </div>
              </div>
              <svg
                aria-hidden="true"
                width="22"
                height="22"
                viewBox="0 0 22 22"
                fill="none"
                style="flex-shrink: 0">
                <path d="M11 3v16M3 11h16" stroke="#fff" stroke-width="2" stroke-linecap="round" />
              </svg>
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
