<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vimo — Chi tiêu định kỳ: Chi tiết kỳ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #eaebf1;
        font-family:
          'Manrope',
          system-ui,
          -apple-system,
          sans-serif;
        color: #101828;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      * {
        box-sizing: border-box;
      }
      ::-webkit-scrollbar {
        display: none;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      .phone-frame {
        width: 402px;
        height: 874px;
        background: #f4f5fa;
        border-radius: 44px;
        box-shadow: 0 24px 60px rgba(16, 24, 40, 0.18);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 8px solid #1e232a;
      }
      .status-bar {
        height: 48px;
        padding: 14px 24px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 800;
        color: #101828;
        z-index: 10;
        flex: none;
      }
      .screen-content {
        flex: 1;
        overflow: auto;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .asset-shortcut {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        border: 0;
        margin: 0;
        font: inherit;
        text-align: left;
        transition:
          background-color 120ms ease,
          box-shadow 120ms ease;
      }
      .asset-shortcut:hover {
        background: #fafbfc !important;
      }
      .asset-shortcut:active {
        background: #f2f4f7 !important;
        box-shadow: 0 1px 4px rgba(16, 24, 40, 0.08) !important;
      }
      .gold-control {
        appearance: none;
        -webkit-appearance: none;
        border: 0;
        margin: 0;
        font: inherit;
        text-align: inherit;
        color: inherit;
        transition: opacity 120ms ease;
      }
      .gold-control:active {
        opacity: 0.72;
      }
      @keyframes vela-pulse {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes vimo-rise {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes vimo-fade-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes vimo-loading {
        0% {
          transform: translateX(-52px);
        }
        50% {
          transform: translateX(42px);
        }
        100% {
          transform: translateX(122px);
        }
      }
    </style>
  </head>
  <body>
    <div class="phone-frame">
      <div class="status-bar">
        <span>9:41</span>
        <div style="display: flex; gap: 6px; align-items: center">
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none">
            <rect width="3" height="4" rx="0.5" y="7" fill="#101828" />
            <rect width="3" height="6" rx="0.5" x="4" y="5" fill="#101828" />
            <rect width="3" height="8" rx="0.5" x="8" y="3" fill="#101828" />
            <rect width="3" height="11" rx="0.5" x="12" fill="#101828" />
          </svg>
          <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
            <path d="M7.5 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z" fill="#101828" />
            <path
              d="M4.3 6.8a4.5 4.5 0 0 1 6.4 0"
              stroke="#101828"
              stroke-width="1.2"
              stroke-linecap="round" />
            <path
              d="M2.1 4.6a7.5 7.5 0 0 1 10.8 0"
              stroke="#101828"
              stroke-width="1.2"
              stroke-linecap="round" />
          </svg>
          <svg width="22" height="11" viewBox="0 0 22 11" fill="none">
            <rect x="0.5" y="0.5" width="18" height="10" rx="2.5" stroke="#101828" />
            <rect x="2" y="2" width="13" height="7" rx="1.5" fill="#101828" />
            <path d="M20 4v3" stroke="#101828" stroke-linecap="round" />
          </svg>
        </div>
      </div>
      <div class="screen-content">
        <div style="height: 100%; display: flex; flex-direction: column; background: #f4f5fa">
          <div style="flex: 1; overflow: auto; padding: 10px 20px 24px">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 18px">
              <a
                href="10-recurring-list.html"
                style="
                  width: 40px;
                  height: 40px;
                  border: 0;
                  border-radius: 20px;
                  background: #fff;
                  box-shadow: 0 2px 8px rgba(16, 24, 40, 0.06);
                  cursor: pointer;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  text-decoration: none;
                ">
                <svg width="9" height="15" viewBox="0 0 9 15" fill="none">
                  <path
                    d="M7.5 1.5l-6 6 6 6"
                    stroke="#101828"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>
              </a>
              <div>
                <div style="font-size: 20px; font-weight: 800">YouTube Premium</div>
                <div style="font-size: 11px; color: #8b93a7; font-weight: 600">Kỳ chi dự kiến</div>
              </div>
            </div>

            <div
              style="
                padding: 12px 14px;
                border-radius: 14px;
                background: #fff6e8;
                color: #8a4b08;
                font-size: 11px;
                line-height: 17px;
                font-weight: 700;
                margin-bottom: 14px;
              ">
              Quá hạn 1 ngày · Khoản này chưa ảnh hưởng số dư hoặc báo cáo.
            </div>

            <div
              style="
                border-radius: 22px;
                padding: 20px;
                color: #fff;
                background: linear-gradient(135deg, #3a5fe5, #182b6e);
                box-shadow: 0 12px 24px rgba(30, 60, 180, 0.25);
                margin-bottom: 16px;
              ">
              <div style="font-size: 11px; font-weight: 700; opacity: 0.8">SỐ TIỀN DỰ KIẾN</div>
              <div style="font-size: 29px; font-weight: 800; margin: 7px 0 14px">189.000 ₫</div>
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  font-size: 11px;
                  font-weight: 700;
                  opacity: 0.86;
                ">
                <span>Đến hạn 27 thg 8</span>
                <span>Hàng tháng</span>
              </div>
            </div>

            <div
              style="
                background: #fff;
                border-radius: 18px;
                padding: 4px 16px;
                box-shadow: 0 2px 10px rgba(16, 24, 40, 0.05);
                margin-bottom: 14px;
              ">
              <div
                style="
                  min-height: 54px;
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  border-bottom: 1px solid rgba(16, 24, 40, 0.06);
                ">
                <span style="font-size: 13px; color: #667085; font-weight: 600">So với lịch</span>
                <b style="font-size: 13px; color: #2f6fed">+10.000 ₫</b>
              </div>
              <div
                style="
                  min-height: 54px;
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  border-bottom: 1px solid rgba(16, 24, 40, 0.06);
                ">
                <span style="font-size: 13px; color: #667085; font-weight: 600">Danh mục</span>
                <b style="font-size: 13px">Hóa đơn ›</b>
              </div>
              <div
                style="
                  min-height: 54px;
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                ">
                <span style="font-size: 13px; color: #667085; font-weight: 600">Ngày ghi nhận</span>
                <b style="font-size: 13px">Hôm nay ›</b>
              </div>
            </div>

            <a
              href="12-recurring-scope.html"
              style="
                display: block;
                text-align: center;
                width: 100%;
                border: 0;
                border-radius: 15px;
                padding: 15px;
                background: #2f6fed;
                color: #fff;
                font-size: 14px;
                font-weight: 800;
                cursor: pointer;
                text-decoration: none;
                box-sizing: border-box;
              "
              >Xác nhận đã chi</a
            >
            <a
              href="10-recurring-list.html"
              style="
                display: block;
                text-align: center;
                width: 100%;
                border: 1px solid #d0d5dd;
                border-radius: 15px;
                padding: 14px;
                background: #fff;
                color: #344054;
                font-size: 13px;
                font-weight: 800;
                margin-top: 10px;
                cursor: pointer;
                text-decoration: none;
                box-sizing: border-box;
              "
              >Bỏ qua kỳ này</a
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
