<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vimo — Mục tiêu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #eaebf1;
        font-family:
          'Manrope',
          system-ui,
          -apple-system,
          sans-serif;
        color: #101828;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      * {
        box-sizing: border-box;
      }
      ::-webkit-scrollbar {
        display: none;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      .phone-frame {
        width: 402px;
        height: 874px;
        background: #f4f5fa;
        border-radius: 44px;
        box-shadow: 0 24px 60px rgba(16, 24, 40, 0.18);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 8px solid #1e232a;
      }
      .status-bar {
        height: 48px;
        padding: 14px 24px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 800;
        color: #101828;
        z-index: 10;
        flex: none;
      }
      .screen-content {
        flex: 1;
        overflow: auto;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .asset-shortcut {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        border: 0;
        margin: 0;
        font: inherit;
        text-align: left;
        transition:
          background-color 120ms ease,
          box-shadow 120ms ease;
      }
      .asset-shortcut:hover {
        background: #fafbfc !important;
      }
      .asset-shortcut:active {
        background: #f2f4f7 !important;
        box-shadow: 0 1px 4px rgba(16, 24, 40, 0.08) !important;
      }
      .gold-control {
        appearance: none;
        -webkit-appearance: none;
        border: 0;
        margin: 0;
        font: inherit;
        text-align: inherit;
        color: inherit;
        transition: opacity 120ms ease;
      }
      .gold-control:active {
        opacity: 0.72;
      }
      @keyframes vela-pulse {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes vimo-rise {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes vimo-fade-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes vimo-loading {
        0% {
          transform: translateX(-52px);
        }
        50% {
          transform: translateX(42px);
        }
        100% {
          transform: translateX(122px);
        }
      }
    </style>
  </head>
  <body>
    <div class="phone-frame">
      <div class="status-bar">
        <span>9:41</span>
        <div style="display: flex; gap: 6px; align-items: center">
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none">
            <rect width="3" height="4" rx="0.5" y="7" fill="#101828" />
            <rect width="3" height="6" rx="0.5" x="4" y="5" fill="#101828" />
            <rect width="3" height="8" rx="0.5" x="8" y="3" fill="#101828" />
            <rect width="3" height="11" rx="0.5" x="12" fill="#101828" />
          </svg>
          <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
            <path d="M7.5 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z" fill="#101828" />
            <path
              d="M4.3 6.8a4.5 4.5 0 0 1 6.4 0"
              stroke="#101828"
              stroke-width="1.2"
              stroke-linecap="round" />
            <path
              d="M2.1 4.6a7.5 7.5 0 0 1 10.8 0"

              stroke-width="1.2"
              stroke-linecap="round" />

            <rect x="2" y="2" width="13" height="7" rx="1.5" fill="#101828" />
            <path d="M20 4v3" stroke="#101828" stroke-linecap="round" />
          </svg>
        </div>
      </div>
      <div class="screen-content">

</html>
