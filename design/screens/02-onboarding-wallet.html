<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vimo — Onboarding 2: Tạo ví đầu tiên</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #eaebf1;
        font-family:
          'Manrope',
          system-ui,
          -apple-system,
          sans-serif;
        color: #101828;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      * {
        box-sizing: border-box;
      }
      ::-webkit-scrollbar {
        display: none;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      .phone-frame {
        width: 402px;
        height: 874px;
        background: #f4f5fa;
        border-radius: 44px;
        box-shadow: 0 24px 60px rgba(16, 24, 40, 0.18);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 8px solid #1e232a;
      }
      .status-bar {
        height: 48px;
        padding: 14px 24px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 800;
        color: #101828;
        z-index: 10;
        flex: none;
      }
      .screen-content {
        flex: 1;
        overflow: auto;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .asset-shortcut {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        border: 0;
        margin: 0;
        font: inherit;
        text-align: left;
        transition:
          background-color 120ms ease,
          box-shadow 120ms ease;
      }
      .asset-shortcut:hover {
        background: #fafbfc !important;
      }
      .asset-shortcut:active {
        background: #f2f4f7 !important;
        box-shadow: 0 1px 4px rgba(16, 24, 40, 0.08) !important;
      }
      .gold-control {
        appearance: none;
        -webkit-appearance: none;
        border: 0;
        margin: 0;
        font: inherit;
        text-align: inherit;
        color: inherit;
        transition: opacity 120ms ease;
      }
      .gold-control:active {
        opacity: 0.72;
      }
      @keyframes vela-pulse {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes vimo-rise {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes vimo-fade-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes vimo-loading {
        0% {
          transform: translateX(-52px);
        }
        50% {
          transform: translateX(42px);
        }
        100% {
          transform: translateX(122px);
        }
      }
    </style>
  </head>
  <body>
    <div class="phone-frame">
      <div class="status-bar">
        <span>9:41</span>
        <div style="display: flex; gap: 6px; align-items: center">
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none">
            <rect width="3" height="4" rx="0.5" y="7" fill="#101828" />
            <rect width="3" height="6" rx="0.5" x="4" y="5" fill="#101828" />
            <rect width="3" height="8" rx="0.5" x="8" y="3" fill="#101828" />
            <rect width="3" height="11" rx="0.5" x="12" fill="#101828" />
          </svg>
          <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
            <path d="M7.5 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z" fill="#101828" />
            <path
              d="M4.3 6.8a4.5 4.5 0 0 1 6.4 0"
              stroke="#101828"
              stroke-width="1.2"
              stroke-linecap="round" />
            <path
              d="M2.1 4.6a7.5 7.5 0 0 1 10.8 0"
              stroke="#101828"
              stroke-width="1.2"
              stroke-linecap="round" />
          </svg>
          <svg width="22" height="11" viewBox="0 0 22 11" fill="none">
            <rect x="0.5" y="0.5" width="18" height="10" rx="2.5" stroke="#101828" />
            <rect x="2" y="2" width="13" height="7" rx="1.5" fill="#101828" />
            <path d="M20 4v3" stroke="#101828" stroke-linecap="round" />
          </svg>
        </div>
      </div>
      <div class="screen-content">
        <div
          style="
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #f4f5fa;
            position: relative;
          ">
          <div style="flex: none; padding: 10px 20px 0">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 26px">
              <a
                href="01-onboarding-name.html"
                style="
                  cursor: pointer;
                  width: 32px;
                  height: 32px;
                  border-radius: 16px;
                  background: #fff;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  box-shadow: 0 2px 8px rgba(16, 24, 40, 0.06);
                  flex-shrink: 0;
                  text-decoration: none;
                ">
                <svg width="9" height="15" viewBox="0 0 9 15" fill="none">
                  <path
                    d="M7.5 1.5l-6 6 6 6"
                    stroke="#101828"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>
              </a>
              <div style="flex: 1; display: flex; gap: 6px; justify-content: center">
                <div style="width: 8px; height: 8px; border-radius: 4px; background: #d9dde6"></div>
                <div
                  style="width: 26px; height: 8px; border-radius: 4px; background: #2f6fed"></div>
                <div style="width: 8px; height: 8px; border-radius: 4px; background: #d9dde6"></div>
                <div style="width: 8px; height: 8px; border-radius: 4px; background: #d9dde6"></div>
              </div>
              <a
                href="05-overview.html"
                style="
                  cursor: pointer;
                  width: 32px;
                  height: 32px;
                  border-radius: 16px;
                  background: #fff;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  box-shadow: 0 2px 8px rgba(16, 24, 40, 0.06);
                  flex-shrink: 0;
                  text-decoration: none;
                ">
                <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
                  <path
                    d="M1 1l12 12M13 1L1 13"
                    stroke="#101828"
                    stroke-width="1.8"
                    stroke-linecap="round" />
                </svg>
              </a>
            </div>
          </div>
          <div
            style="
              flex: 1;
              overflow: auto;
              padding: 4px 20px 24px;
              display: flex;
              flex-direction: column;
            ">
            <div style="flex: 1; display: flex; flex-direction: column">
              <div
                style="
                  width: 56px;
                  height: 56px;
                  border-radius: 28px;
                  background: #2f6fed;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  margin-bottom: 20px;
                  box-shadow: 0 8px 16px rgba(47, 111, 237, 0.28);
                ">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                  <rect
                    x="3"
                    y="6"
                    width="18"
                    height="13"
                    rx="2.5"
                    stroke="#fff"
                    stroke-width="1.8" />
                  <path d="M3 10h18" stroke="#fff" stroke-width="1.8" />
                  <circle cx="16.5" cy="14" r="1.3" fill="#fff" />
                </svg>
              </div>
              <div style="font-size: 22px; font-weight: 800; color: #101828; margin-bottom: 8px">
                Tạo ví đầu tiên của bạn
              </div>
              <div
                style="
                  font-size: 14px;
                  color: #8b93a7;
                  font-weight: 600;
                  line-height: 1.5;
                  margin-bottom: 24px;
                ">
                Bạn cần có ít nhất một ví để bắt đầu theo dõi thu chi
              </div>
              <div
                style="
                  background: #fff;
                  border-radius: 18px;
                  padding: 18px;
                  box-shadow: 0 2px 10px rgba(16, 24, 40, 0.05);
                  margin-bottom: 16px;
                ">
                <div style="font-size: 12px; font-weight: 700; color: #8b93a7; margin-bottom: 8px">
                  Tên ví
                </div>
                <input
                  type="text"
                  value="Ví tiền mặt"
                  placeholder="Ví dụ: Ví tiền mặt"
                  style="
                    width: 100%;
                    border: none;
                    outline: none;
                    font-size: 16px;
                    font-weight: 700;
                    color: #101828;
                  " />
              </div>
              <div style="font-size: 13px; font-weight: 700; color: #101828; margin-bottom: 10px">
                Loại ví
              </div>
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <div
                  style="
                    padding: 8px 14px;
                    border-radius: 10px;
                    background: #101828;
                    color: #fff;
                    font-weight: 700;
                    font-size: 13px;
                  ">
                  Tiền mặt
                </div>
                <div
                  style="
                    padding: 8px 14px;
                    border-radius: 10px;
                    background: #edeef3;
                    color: #8b93a7;
                    font-weight: 600;
                    font-size: 13px;
                  ">
                  Ngân hàng
                </div>
                <div
                  style="
                    padding: 8px 14px;
                    border-radius: 10px;
                    background: #edeef3;
                    color: #8b93a7;
                    font-weight: 600;
                    font-size: 13px;
                  ">
                  Ví điện tử
                </div>
              </div>
              <div style="flex: 1"></div>
              <a
                href="03-onboarding-balance.html"
                style="
                  cursor: pointer;
                  text-align: center;
                  padding: 15px;
                  border-radius: 14px;
                  background: #2f6fed;
                  color: #fff;
                  font-size: 15px;
                  font-weight: 800;
                  box-shadow: 0 8px 16px rgba(47, 111, 237, 0.25);
                  text-decoration: none;
                "
                >Tiếp tục</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
