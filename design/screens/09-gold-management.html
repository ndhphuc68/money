<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vimo — Quản lý vàng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #eaebf1;
        font-family:
          'Manrope',
          system-ui,
          -apple-system,
          sans-serif;
        color: #101828;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      * {
        box-sizing: border-box;
      }
      ::-webkit-scrollbar {
        display: none;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      .phone-frame {
        width: 402px;
        height: 874px;
        background: #f4f5fa;
        border-radius: 44px;
        box-shadow: 0 24px 60px rgba(16, 24, 40, 0.18);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 8px solid #1e232a;
      }
      .status-bar {
        height: 48px;
        padding: 14px 24px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 800;
        color: #101828;
        z-index: 10;
        flex: none;
      }
      .screen-content {
        flex: 1;
        overflow: auto;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .asset-shortcut {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        border: 0;
        margin: 0;
        font: inherit;
        text-align: left;
        transition:
          background-color 120ms ease,
          box-shadow 120ms ease;
      }
      .asset-shortcut:hover {
        background: #fafbfc !important;
      }
      .asset-shortcut:active {
        background: #f2f4f7 !important;
        box-shadow: 0 1px 4px rgba(16, 24, 40, 0.08) !important;
      }
      .gold-control {
        appearance: none;
        -webkit-appearance: none;
        border: 0;
        margin: 0;
        font: inherit;
        text-align: inherit;
        color: inherit;
        transition: opacity 120ms ease;
      }
      .gold-control:active {
        opacity: 0.72;
      }
      @keyframes vela-pulse {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes vimo-rise {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes vimo-fade-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes vimo-loading {
        0% {
          transform: translateX(-52px);
        }
        50% {
          transform: translateX(42px);
        }
        100% {
          transform: translateX(122px);
        }
      }
    </style>
  </head>
  <body>
    <div class="phone-frame">
      <div class="status-bar">
        <span>9:41</span>
        <div style="display: flex; gap: 6px; align-items: center">
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none">
            <rect width="3" height="4" rx="0.5" y="7" fill="#101828" />
            <rect width="3" height="6" rx="0.5" x="4" y="5" fill="#101828" />
            <rect width="3" height="8" rx="0.5" x="8" y="3" fill="#101828" />
            <rect width="3" height="11" rx="0.5" x="12" fill="#101828" />
          </svg>
          <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
            <path d="M7.5 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z" fill="#101828" />
            <path
              d="M4.3 6.8a4.5 4.5 0 0 1 6.4 0"
              stroke="#101828"
              stroke-width="1.2"
              stroke-linecap="round" />
            <path
              d="M2.1 4.6a7.5 7.5 0 0 1 10.8 0"
              stroke="#101828"
              stroke-width="1.2"
              stroke-linecap="round" />
          </svg>
          <svg width="22" height="11" viewBox="0 0 22 11" fill="none">
            <rect x="0.5" y="0.5" width="18" height="10" rx="2.5" stroke="#101828" />
            <rect x="2" y="2" width="13" height="7" rx="1.5" fill="#101828" />
            <path d="M20 4v3" stroke="#101828" stroke-linecap="round" />
          </svg>
        </div>
      </div>
      <div class="screen-content">
        <div
          style="
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #f4f5fa;
            position: relative;
            overflow: hidden;
          ">
          <header
            style="
              flex: none;
              padding: 10px 20px 12px;
              display: flex;
              align-items: center;
              gap: 12px;
            ">
            <a
              href="08-settings.html"
              class="gold-control gold-back"
              aria-label="Quay lại"
              style="
                width: 44px;
                height: 44px;
                padding: 0;
                cursor: pointer;
                border-radius: 22px;
                background: #fff;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 2px 8px rgba(16, 24, 40, 0.06);
                flex-shrink: 0;
                text-decoration: none;
              ">
              <svg aria-hidden="true" width="10" height="18" viewBox="0 0 10 18" fill="none">
                <path
                  d="M8.5 1.5 1.5 9l7 7.5"
                  stroke="#101828"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </a>
            <h1
              style="
                margin: 0;
                font-size: 20px;
                line-height: 28px;
                font-weight: 800;
                color: #101828;
              ">
              Quản lý vàng
            </h1>
          </header>

          <main style="flex: 1; min-height: 0; overflow: auto; padding: 4px 20px 116px">
            <section
              aria-label="Tổng quan vàng"
              style="
                border-radius: 20px;
                padding: 20px;
                color: #fff;
                background: linear-gradient(135deg, #f4b942 0%, #c98213 100%);
                margin-bottom: 24px;
                box-shadow: 0 10px 20px rgba(201, 130, 19, 0.2);
              ">
              <div
                style="
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  gap: 16px;
                  margin-bottom: 20px;
                ">
                <div style="min-width: 0">
                  <div style="font-size: 15px; font-weight: 800; margin-bottom: 4px">
                    Vàng của tôi
                  </div>
                  <div style="font-size: 12px; line-height: 18px; opacity: 0.9; font-weight: 600">
                    Tổng quan tài sản vàng đã mua
                  </div>
                </div>
                <div
                  aria-hidden="true"
                  style="
                    width: 44px;
                    height: 44px;
                    border-radius: 22px;
                    background: rgba(255, 255, 255, 0.22);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 17px;
                    font-weight: 700;
                    flex-shrink: 0;
                  ">
                  Au
                </div>
              </div>
              <div
                style="
                  display: grid;
                  grid-template-columns: minmax(72px, 0.7fr) minmax(0, 1.5fr);
                  gap: 20px;
                ">
                <div>
                  <div style="font-size: 12px; opacity: 0.92; font-weight: 700; margin-bottom: 4px">
                    Khối lượng
                  </div>
                  <div
                    style="
                      font-size: 20px;
                      line-height: 28px;
                      font-weight: 800;
                      white-space: nowrap;
                    ">
                    5 chỉ
                  </div>
                </div>
                <div style="min-width: 0">
                  <div style="font-size: 12px; opacity: 0.92; font-weight: 700; margin-bottom: 4px">
                    Giá vốn
                  </div>
                  <div
                    style="
                      font-size: 19px;
                      line-height: 28px;
                      font-weight: 800;
                      white-space: nowrap;
                    ">
                    42.500.000 ₫
                  </div>
                </div>
              </div>
            </section>

            <section aria-labelledby="gold-history-title">
              <div
                style="
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  margin-bottom: 8px;
                ">
                <h2
                  id="gold-history-title"
                  style="
                    font-size: 12px;
                    line-height: 18px;
                    font-weight: 800;
                    color: #667085;
                    text-transform: uppercase;
                    letter-spacing: 0.08em;
                    margin: 0;
                  ">
                  Lịch sử giao dịch
                </h2>
                <button
                  type="button"
                  class="gold-control"
                  style="
                    min-height: 44px;
                    padding: 0 4px;
                    background: transparent;
                    color: #667085;
                    font-size: 12px;
                    font-weight: 800;
                    cursor: pointer;
                  ">
                  Thùng rác
                </button>
              </div>
              <div
                style="
                  background: #fff;
                  border-radius: 18px;
                  padding: 4px 16px;
                  box-shadow: 0 2px 10px rgba(16, 24, 40, 0.05);
                ">
                <div
                  style="
                    width: 100%;
                    background: #fff;
                    display: flex;
                    align-items: center;
                    gap: 12px;
                    padding: 12px 0;
                    border-bottom: 1px solid rgba(16, 24, 40, 0.08);
                    cursor: pointer;
                  ">
                  <div
                    aria-hidden="true"
                    style="
                      width: 40px;
                      height: 40px;
                      border-radius: 20px;
                      background: #fff4d6;
                      color: #a96308;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      font-size: 13px;
                      font-weight: 800;
                      flex-shrink: 0;
                    ">
                    Au
                  </div>
                  <div style="flex: 1; min-width: 0">
                    <div
                      style="font-size: 14px; line-height: 20px; font-weight: 800; color: #101828">
                      Nhẫn trơn 9999
                    </div>
                    <div
                      style="
                        font-size: 12px;
                        line-height: 17px;
                        color: #667085;
                        font-weight: 600;
                        margin-top: 4px;
                      ">
                      24/08/2026 · 2 chỉ
                    </div>
                  </div>
                  <div
                    style="
                      font-size: 12px;
                      line-height: 18px;
                      font-weight: 800;
                      color: #101828;
                      text-align: right;
                      white-space: nowrap;
                      flex-shrink: 0;
                    ">
                    17.000.000 ₫
                  </div>
                </div>
                <div
                  style="
                    width: 100%;
                    background: #fff;
                    display: flex;
                    align-items: center;
                    gap: 12px;
                    padding: 12px 0;
                    cursor: pointer;
                  ">
                  <div
                    aria-hidden="true"
                    style="
                      width: 40px;
                      height: 40px;
                      border-radius: 20px;
                      background: #ecfdf3;
                      color: #067647;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      flex-shrink: 0;
                    ">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                      <path
                        d="M3 9h12M11 5l4 4-4 4"
                        stroke="#067647"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round" />
                    </svg>
                  </div>
                  <div style="flex: 1; min-width: 0">
                    <div
                      style="font-size: 14px; line-height: 20px; font-weight: 800; color: #101828">
                      Bán nhẫn trơn 9999
                    </div>
                    <div
                      style="
                        font-size: 12px;
                        line-height: 17px;
                        color: #667085;
                        font-weight: 600;
                        margin-top: 4px;
                      ">
                      12/08/2026 · 1 chỉ · lô PNJ
                    </div>
                  </div>
                  <div
                    style="
                      font-size: 12px;
                      line-height: 18px;
                      font-weight: 800;
                      color: #067647;
                      text-align: right;
                      white-space: nowrap;
                      flex-shrink: 0;
                    ">
                    +8.700.000 ₫
                  </div>
                </div>
              </div>
            </section>
          </main>

          <div
            style="
              position: absolute;
              left: 0;
              right: 0;
              bottom: 0;
              padding: 12px 20px 34px;
              background: linear-gradient(180deg, rgba(244, 245, 250, 0) 0%, #f4f5fa 22%);
            ">
            <button
              type="button"
              class="gold-control"
              aria-label="Thêm giao dịch"
              style="
                width: 100%;
                cursor: pointer;
                min-height: 60px;
                border-radius: 16px;
                padding: 12px 16px;
                background: #101828;
                color: #fff;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                box-shadow: 0 8px 18px rgba(16, 24, 40, 0.16);
              ">
              <div style="min-width: 0; text-align: left">
                <div style="font-size: 14px; line-height: 20px; font-weight: 800">
                  Thêm giao dịch
                </div>
                <div
                  style="
                    font-size: 12px;
                    line-height: 17px;
                    color: #d0d5dd;
                    margin-top: 4px;
                    font-weight: 600;
                  ">
                  Ghi lại lần mua hoặc bán vàng
                </div>
              </div>
              <svg
                aria-hidden="true"
                width="22"
                height="22"
                viewBox="0 0 22 22"
                fill="none"
                style="flex-shrink: 0">
                <path d="M11 3v16M3 11h16" stroke="#fff" stroke-width="2" stroke-linecap="round" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
