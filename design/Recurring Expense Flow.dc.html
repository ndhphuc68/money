<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vela — Luồng chi tiêu định kỳ</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #eaebf1;
        color: var(--color-text);
        font-family: var(--font-sans);
        padding: 40px 20px 104px;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .workspace {
        max-width: 1180px;
        margin: 0 auto;
      }
      .intro {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.09em;
        color: var(--color-primary);
        text-transform: uppercase;
      }
      h1 {
        font-size: 28px;
        line-height: 36px;
        margin: 5px 0 4px;
        font-weight: 800;
      }
      .intro p {
        font-size: 13px;
        color: var(--color-text-muted);
        font-weight: 600;
        margin: 0;
      }
      .progress {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .progress span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c8cdd9;
      }
      .progress span.active {
        width: 26px;
        border-radius: 8px;
        background: var(--color-primary);
      }
      .device {
        width: 390px;
        height: 844px;
        margin: auto;
        border-radius: 48px;
        background: var(--color-background);
        box-shadow: 0 40px 80px rgba(16, 24, 40, 0.18);
        overflow: hidden;
        position: relative;
      }
      .status {
        height: 44px;
        padding: 15px 24px 0;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 800;
      }
      .screen {
        height: 800px;
        display: flex;
        flex-direction: column;
      }
      .scroll {
        flex: 1;
        overflow: auto;
        padding: 8px 20px 118px;
        scrollbar-width: none;
      }
      .scroll::-webkit-scrollbar {
        display: none;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      .back {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 22px;
        background: #fff;
        display: grid;
        place-items: center;
        box-shadow: var(--shadow-card);
      }
      .header h2 {
        font-size: 20px;
        line-height: 28px;
        margin: 0;
        font-weight: 800;
      }
      .header small {
        display: block;
        color: var(--color-text-muted);
        font-size: 11px;
        font-weight: 600;
        margin-top: 1px;
      }
      .segment {
        display: flex;
        gap: 6px;
        padding: 4px;
        background: #edeef3;
        border-radius: 12px;
        margin-bottom: 18px;
      }
      .segment button {
        flex: 1;
        border: 0;
        border-radius: 10px;
        padding: 10px;
        background: transparent;
        color: var(--color-text-muted);
        font-size: 13px;
        font-weight: 700;
      }
      .segment .active {
        background: #101828;
        color: #fff;
      }
      .amount-card,
      .card {
        background: #fff;
        border-radius: 18px;
        box-shadow: var(--shadow-card);
      }
      .amount-card {
        padding: 18px;
        margin-bottom: 14px;
      }
      .label {
        font-size: 12px;
        line-height: 18px;
        font-weight: 800;
        color: #344054;
        margin-bottom: 6px;
      }
      .amount-input {
        border: 0;
        outline: 0;
        width: 100%;
        font-size: 28px;
        font-weight: 800;
        color: #101828;
      }
      .categories {
        display: flex;
        gap: 8px;
        overflow: auto;
        margin: 0 0 14px;
        scrollbar-width: none;
      }
      .chip {
        white-space: nowrap;
        border: 0;
        border-radius: 10px;
        padding: 8px 12px;
        background: #edeef3;
        color: #8b93a7;
        font-size: 12px;
        font-weight: 700;
      }
      .chip.active {
        background: #101828;
        color: #fff;
      }
      .card {
        padding: 4px 16px;
        margin-bottom: 14px;
      }
      .field {
        min-height: 56px;
        border-bottom: 1px solid var(--divider);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .field:last-child {
        border-bottom: 0;
      }
      .field-name {
        font-size: 13px;
        color: var(--color-text-muted);
        font-weight: 600;
      }
      .field-value {
        font-size: 13px;
        color: #101828;
        font-weight: 800;
        text-align: right;
      }
      .field-value.muted {
        color: #9aa1b4;
        font-weight: 600;
      }
      .toggle {
        width: 48px;
        height: 28px;
        padding: 3px;
        border: 0;
        border-radius: 99px;
        background: #d9dde6;
      }
      .toggle::after {
        content: '';
        display: block;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 2px 5px rgba(16, 24, 40, 0.2);
        transition: transform 0.16s;
      }
      .toggle.on {
        background: var(--color-primary);
      }
      .toggle.on::after {
        transform: translateX(20px);
      }
      .recurring-fields {
        display: none;
      }
      .recurring-fields.show {
        display: block;
      }
      .inline-select {
        appearance: none;
        border: 0;
        outline: 0;
        background: transparent;
        color: #101828;
        font-size: 13px;
        font-weight: 800;
        text-align: right;
      }
      .explain {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        margin: -2px 2px 18px;
        color: var(--color-text-muted);
        font-size: 11px;
        line-height: 17px;
        font-weight: 600;
      }
      .info {
        width: 17px;
        height: 17px;
        border-radius: 50%;
        background: #dfe8ff;
        color: var(--color-primary);
        display: grid;
        place-items: center;
        flex: none;
        font-size: 10px;
        font-weight: 800;
      }
      .sticky {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 16px 20px 34px;
        background: linear-gradient(180deg, rgba(244, 245, 250, 0), #f4f5fa 24%);
      }
      .primary {
        width: 100%;
        min-height: 54px;
        border: 0;
        border-radius: 16px;
        background: #101828;
        color: #fff;
        font-size: 14px;
        font-weight: 800;
        box-shadow: 0 8px 18px rgba(16, 24, 40, 0.16);
      }
      .primary.blue {
        background: var(--color-primary);
        box-shadow: 0 8px 18px rgba(47, 111, 237, 0.25);
      }
      .success-icon {
        width: 72px;
        height: 72px;
        border-radius: 24px;
        background: #ecfdf3;
        display: grid;
        place-items: center;
        margin: 76px auto 22px;
      }
      .success {
        text-align: center;
        padding: 0 24px;
      }
      .success h2 {
        font-size: 23px;
        margin: 0 0 8px;
      }
      .success p {
        font-size: 13px;
        line-height: 20px;
        color: var(--color-text-muted);
        font-weight: 600;
        margin: 0;
      }
      .summary {
        margin: 28px 0 14px;
        padding: 6px 16px;
      }
      .summary .field {
        min-height: 53px;
      }
      .next-box {
        background: #edf3ff;
        border-radius: 16px;
        padding: 15px;
        color: #1849a9;
        font-size: 12px;
        line-height: 18px;
        font-weight: 700;
        text-align: left;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .tab {
        border: 0;
        border-radius: 99px;
        background: #edeef3;
        color: #667085;
        padding: 9px 13px;
        font-size: 12px;
        font-weight: 800;
      }
      .tab.active {
        background: #dfe8ff;
        color: var(--color-primary);
      }
      .occurrence {
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .occurrence + .occurrence {
        border-top: 1px solid var(--divider);
      }
      .icon {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--color-cat-bills);
        flex: none;
      }
      .occurrence-main {
        flex: 1;
        min-width: 0;
      }
      .occurrence-title {
        font-size: 14px;
        font-weight: 800;
      }
      .meta {
        font-size: 11px;
        color: var(--color-text-muted);
        font-weight: 600;
        margin-top: 3px;
      }
      .money {
        font-size: 13px;
        font-weight: 800;
        white-space: nowrap;
      }
      .badge {
        display: inline-flex;
        margin-top: 6px;
        padding: 4px 8px;
        border-radius: 99px;
        font-size: 10px;
        font-weight: 800;
      }
      .badge.overdue {
        background: #fee4e2;
        color: #b42318;
      }
      .badge.pending {
        background: #edf3ff;
        color: #1849a9;
      }
      .notice {
        border-radius: 14px;
        background: #fff6e8;
        color: #8a4b08;
        padding: 12px 14px;
        margin-bottom: 14px;
        font-size: 11px;
        line-height: 17px;
        font-weight: 700;
      }
      .hero {
        background: var(--gradient-balance);
        color: #fff;
        border-radius: 22px;
        padding: 20px;
        box-shadow: var(--shadow-elevated);
        margin-bottom: 16px;
      }
      .hero .hero-label {
        font-size: 11px;
        font-weight: 700;
        opacity: 0.78;
      }
      .hero strong {
        display: block;
        font-size: 29px;
        margin: 7px 0 14px;
      }
      .hero-meta {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 700;
        opacity: 0.86;
      }
      .edit-value {
        color: var(--color-primary);
      }
      .secondary {
        width: 100%;
        min-height: 50px;
        border: 1px solid #d0d5dd;
        border-radius: 15px;
        background: #fff;
        color: #344054;
        font-size: 13px;
        font-weight: 800;
        margin-top: 10px;
      }
      .sheet-bg {
        position: absolute;
        inset: 0;
        background: rgba(16, 24, 40, 0.5);
        display: flex;
        align-items: flex-end;
        z-index: 10;
      }
      .sheet {
        width: 100%;
        background: #fff;
        border-radius: 24px 24px 0 0;
        padding: 10px 20px 34px;
      }
      .handle {
        width: 44px;
        height: 5px;
        border-radius: 4px;
        background: #d0d5dd;
        margin: 0 auto 16px;
      }
      .sheet h3 {
        font-size: 19px;
        line-height: 27px;
        margin: 0 0 5px;
      }
      .sheet > p {
        font-size: 12px;
        line-height: 18px;
        color: #667085;
        font-weight: 600;
        margin: 0 0 16px;
      }
      .choice {
        width: 100%;
        text-align: left;
        border: 1px solid #e4e7ec;
        border-radius: 16px;
        background: #fff;
        padding: 14px;
        margin-bottom: 10px;
      }
      .choice b {
        display: block;
        font-size: 13px;
        color: #101828;
      }
      .choice span {
        display: block;
        font-size: 11px;
        line-height: 17px;
        color: #667085;
        margin-top: 3px;
      }
      .choice.recommended {
        border-color: #84adff;
        background: #f5f8ff;
      }
      .choice.recommended b {
        color: #1849a9;
      }
      .section-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #667085;
        font-weight: 800;
        margin: 18px 2px 8px;
      }
      .schedule-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 0;
        border-bottom: 1px solid var(--divider);
      }
      .schedule-row:last-child {
        border-bottom: 0;
      }
      .schedule-main {
        flex: 1;
      }
      .schedule-title {
        font-size: 14px;
        font-weight: 800;
      }
      .state {
        font-size: 10px;
        border-radius: 99px;
        padding: 4px 8px;
        font-weight: 800;
      }
      .state.active {
        background: #ecfdf3;
        color: #067647;
      }
      .timeline {
        border-left: 2px solid #dde4f1;
        margin: 2px 0 0 9px;
        padding-left: 20px;
      }
      .event {
        position: relative;
        padding-bottom: 20px;
      }
      .event::before {
        content: '';
        position: absolute;
        left: -27px;
        top: 2px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--color-primary);
        border: 3px solid #f4f5fa;
      }
      .event b {
        font-size: 13px;
      }
      .event p {
        font-size: 11px;
        color: #667085;
        margin: 4px 0 0;
        font-weight: 600;
      }
      .flowbar {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 10px;
        background: #101828;
        color: #fff;
        border-radius: 99px;
        padding: 8px 10px;
        box-shadow: 0 16px 34px rgba(16, 24, 40, 0.28);
      }
      .flowbar button {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 18px;
      }
      .flowbar button:disabled {
        opacity: 0.35;
      }
      .flow-label {
        width: 210px;
        text-align: center;
      }
      .flow-label b {
        display: block;
        font-size: 12px;
      }
      .flow-label span {
        display: block;
        font-size: 10px;
        color: #b4bacb;
        margin-top: 2px;
      }
      .toast {
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: 104px;
        background: #101828;
        color: #fff;
        border-radius: 14px;
        padding: 13px 15px;
        font-size: 12px;
        font-weight: 700;
        z-index: 30;
        display: none;
      }
      .toast.show {
        display: block;
      }
      @media (max-width: 620px) {
        body {
          padding: 16px 0 100px;
        }
        .intro {
          padding: 0 20px;
        }
        .device {
          border-radius: 0;
          width: 100%;
          max-width: 390px;
        }
        .progress {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="workspace">
      <header class="intro">
        <div>
          <div class="eyebrow">Vela · Design review</div>
          <h1>Chi tiêu định kỳ</h1>
          <p>Một luồng xuyên suốt theo spec MVP, dùng dữ liệu giả và không ghi dữ liệu thật.</p>
        </div>
        <div class="progress" id="progress"></div>
      </header>
      <div class="device">
        <div class="status"><span>9:41</span><span>● ● ▰</span></div>
        <div class="screen" id="screen"></div>
        <div class="toast" id="toast"></div>
      </div>
    </div>
    <nav class="flowbar" aria-label="Điều hướng prototype">
      <button id="prev" aria-label="Bước trước">←</button>
      <div class="flow-label"><b id="flowTitle"></b><span id="flowCount"></span></div>
      <button id="next" aria-label="Bước tiếp">→</button>
    </nav>
    <script>
      const steps = [
        { title: 'Đã tạo lịch', render: created },
        { title: 'Kỳ sắp tới', render: upcoming },
        { title: 'Xác nhận kỳ', render: confirmOccurrence },
        { title: 'Phạm vi thay đổi', render: updateScope },
        { title: 'Quản lý định kỳ', render: management },
      ];
      let step = 0;
      function arrow() {
        return '<svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M7.5 1.5 1.5 8l6 6.5" stroke="#101828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      }
      function check() {
        return '<svg width="34" height="34" viewBox="0 0 34 34" fill="none"><path d="m8 17 6 6L27 10" stroke="#067647" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      }
      function billIcon() {
        return '<svg width="19" height="19" viewBox="0 0 20 20" fill="none"><rect x="5" y="2.5" width="10" height="15" rx="1.2" stroke="#fff" stroke-width="1.5"/><path d="M7.5 7h5M7.5 10h5M7.5 13h3" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>';
      }
      function header(title, subtitle = '') {
        return `<div class="header"><button class="back" onclick="go(-1)">${arrow()}</button><div><h2>${title}</h2>${subtitle ? `<small>${subtitle}</small>` : ''}</div></div>`;
      }
      function created() {
        return `<main class="scroll"><div class="success"><div class="success-icon">${check()}</div><h2>Đã thêm giao dịch</h2><p>Kỳ đầu tiên đã được ghi nhận vào số dư và lịch chi đã được tạo.</p><div class="card summary"><div class="field"><span class="field-name">YouTube Premium</span><span class="field-value">179.000 ₫</span></div><div class="field"><span class="field-name">Chu kỳ</span><span class="field-value">Hàng tháng</span></div><div class="field"><span class="field-name">Tài khoản</span><span class="field-value">Ví chính</span></div></div><div class="next-box">Kỳ tiếp theo: 28 thg 9<br>Nhắc trước 1 ngày · Chưa ảnh hưởng số dư</div></div></main><div class="sticky"><button class="primary blue" onclick="go(1)">Xem kỳ sắp tới</button></div>`;
      }
      function upcoming() {
        return `<main class="scroll">${header('Giao dịch', 'Các kỳ dự kiến không tính vào số dư')}<div class="tabs"><button class="tab active">Sắp tới 2</button><button class="tab">Quá hạn 1</button><button class="tab">Đã xử lý</button></div><div class="section-title">Quá hạn</div><div class="card"><button style="border:0;background:transparent;width:100%;padding:0;text-align:left" onclick="go(1)"><div class="occurrence"><div class="icon">${billIcon()}</div><div class="occurrence-main"><div class="occurrence-title">YouTube Premium</div><div class="meta">Đến hạn hôm qua · Ví chính</div><span class="badge overdue">Quá hạn</span></div><div class="money">179.000 ₫ ›</div></div></button></div><div class="section-title">Sắp tới</div><div class="card"><div class="occurrence"><div class="icon" style="background:#7C5CFC">${billIcon()}</div><div class="occurrence-main"><div class="occurrence-title">Shopee VIP</div><div class="meta">3 thg 9 · Ví chính</div><span class="badge pending">Còn 6 ngày</span></div><div class="money">29.000 ₫</div></div><div class="occurrence"><div class="icon" style="background:#2F6FED">${billIcon()}</div><div class="occurrence-main"><div class="occurrence-title">Tiền nhà</div><div class="meta">5 thg 9 · Tài khoản chính</div><span class="badge pending">Còn 8 ngày</span></div><div class="money">6.500.000 ₫</div></div></div><div class="explain" style="margin-top:18px"><span class="info">i</span><span>Xác nhận hoặc bỏ qua kỳ hiện tại trước khi hệ thống sinh kỳ tiếp theo.</span></div></main>`;
      }
      function confirmOccurrence() {
        return `<main class="scroll">${header('YouTube Premium', 'Kỳ chi dự kiến')}<div class="notice">Quá hạn 1 ngày · Khoản này chưa ảnh hưởng số dư hoặc báo cáo.</div><section class="hero"><div class="hero-label">SỐ TIỀN DỰ KIẾN</div><strong>189.000 ₫</strong><div class="hero-meta"><span>Đến hạn 27 thg 8</span><span>Hàng tháng</span></div></section><div class="card"><div class="field"><span class="field-name">So với lịch</span><span class="field-value edit-value">+10.000 ₫</span></div><div class="field"><span class="field-name">Danh mục</span><span class="field-value">Hóa đơn ›</span></div><div class="field"><span class="field-name">Tài khoản</span><span class="field-value">Ví chính ›</span></div><div class="field"><span class="field-name">Ngày ghi nhận</span><span class="field-value">Hôm nay ›</span></div><div class="field"><span class="field-name">Ghi chú</span><span class="field-value">Gói cá nhân ›</span></div></div><div class="explain"><span class="info">i</span><span>Số tiền đã được chỉnh từ 179.000 ₫. Khi xác nhận, bạn sẽ chọn có cập nhật lịch hay không.</span></div><button class="secondary" onclick="toast('Đã bỏ qua kỳ này · Kỳ tiếp theo: 27 thg 9')">Bỏ qua kỳ này</button></main><div class="sticky"><button class="primary blue" onclick="go(1)">Xác nhận đã chi</button></div>`;
      }
      function updateScope() {
        return `${confirmOccurrence().replace('<div class="sticky"><button class="primary blue" onclick="go(1)">Xác nhận đã chi</button></div>', '')}<div class="sheet-bg"><div class="sheet"><div class="handle"></div><h3>Áp dụng thay đổi thế nào?</h3><p>Số tiền kỳ này khác 10.000 ₫ so với lịch hiện tại.</p><button class="choice" onclick="go(1)"><b>Chỉ kỳ này</b><span>Ghi nhận 189.000 ₫, các kỳ sau vẫn là 179.000 ₫.</span></button><button class="choice recommended" onclick="go(1)"><b>Kỳ này và các kỳ sau</b><span>Ghi nhận kỳ này và cập nhật lịch thành 189.000 ₫.</span></button><button class="secondary" onclick="go(-1)">Quay lại chỉnh sửa</button></div></div>`;
      }
      function management() {
        return `<main class="scroll">${header('Chi tiêu định kỳ', '3 đang chạy · 1 tạm dừng')}<div class="tabs"><button class="tab active">Tất cả 4</button><button class="tab">Đang chạy 3</button><button class="tab">Tạm dừng 1</button></div><div class="card"><div class="schedule-row"><div class="icon">${billIcon()}</div><div class="schedule-main"><div class="schedule-title">YouTube Premium</div><div class="meta">189.000 ₫ · Hàng tháng · 27 thg 9</div></div><span class="state active">Đang chạy</span></div><div class="schedule-row"><div class="icon" style="background:#2F6FED">${billIcon()}</div><div class="schedule-main"><div class="schedule-title">Tiền nhà</div><div class="meta">6.500.000 ₫ · Hàng tháng · 5 thg 9</div></div><span class="state active">Đang chạy</span></div></div><div class="section-title">Lịch sử YouTube Premium</div><div class="timeline"><div class="event"><b>28 thg 8 · Đã xác nhận</b><p>189.000 ₫ · Đã cập nhật các kỳ sau</p></div><div class="event"><b>28 thg 7 · Đã xác nhận</b><p>179.000 ₫ · Ví chính</p></div><div class="event"><b>28 thg 6 · Kỳ đầu tiên</b><p>179.000 ₫ · Đã tạo lịch định kỳ</p></div></div><div class="card"><div class="field"><span class="field-name">Tạm dừng lịch</span><button class="toggle" onclick="this.classList.toggle('on');toast(this.classList.contains('on')?'Đã tạm dừng lịch':'Đã bật lại lịch')"></button></div><div class="field"><span class="field-name">Chỉnh sửa mẫu</span><span class="field-value">›</span></div><div class="field"><span class="field-name" style="color:#B42318">Kết thúc lịch</span><span class="field-value" style="color:#B42318">›</span></div></div><div class="explain"><span class="info">i</span><span>Tạm dừng hoặc kết thúc lịch không xóa các giao dịch thật đã xác nhận.</span></div></main>`;
      }
      function go(delta) {
        step = Math.max(0, Math.min(steps.length - 1, step + delta));
        render();
      }
      function toast(message) {
        const node = document.querySelector('#toast');
        node.textContent = message;
        node.classList.add('show');
        setTimeout(() => node.classList.remove('show'), 2300);
      }
      function render() {
        document.querySelector('#screen').innerHTML = steps[step].render();
        document.querySelector('#flowTitle').textContent = steps[step].title;
        document.querySelector('#flowCount').textContent = `Bước ${step + 1} / ${steps.length}`;
        document.querySelector('#prev').disabled = step === 0;
        document.querySelector('#next').disabled = step === steps.length - 1;
        document.querySelector('#progress').innerHTML = steps
          .map((_, i) => `<span class="${i === step ? 'active' : ''}"></span>`)
          .join('');
      }
      document.querySelector('#prev').onclick = () => go(-1);
      document.querySelector('#next').onclick = () => go(1);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') go(-1);
        if (e.key === 'ArrowRight') go(1);
      });
      render();
    </script>
  </body>
</html>
