<!-- @dsCard group="Components" viewport="700x560" subtitle="BalanceCard, StatCard, TransactionRow, GoalCard, BudgetRow" name="Cards" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../styles.css" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        margin: 0;
        font-family: var(--font-sans);
        background: var(--color-bg);
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script id="app-src" type="text/plain">
      const { useState } = React;

      function BalanceCard({ label = 'Số dư khả dụng', balance, masked = false, maskedText = '•• ••• •••₫', cardNumber, expiry, onToggleMask }) {
        return (
          <div style={{ borderRadius: 'var(--radius-xl)', padding: 22, color: '#fff', background: 'var(--gradient-balance)', boxShadow: 'var(--shadow-elevated)' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <span style={{ fontSize: 12, fontWeight: 'var(--weight-semibold)', opacity: 0.8 }}>{label}</span>
              <button onClick={onToggleMask} style={{ cursor: 'pointer', width: 28, height: 28, borderRadius: '50%', background: 'rgba(255,255,255,0.15)', border: 'none' }}>👁</button>
            </div>
            <div style={{ fontSize: 30, fontWeight: 'var(--weight-black)', margin: '10px 0 18px' }}>{masked ? maskedText : balance}</div>
            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
              <span style={{ fontSize: 14, letterSpacing: 2, fontWeight: 'var(--weight-semibold)', opacity: 0.9 }}>{cardNumber}</span>
              <span style={{ fontSize: 12, opacity: 0.75, fontWeight: 'var(--weight-semibold)' }}>{expiry}</span>
            </div>
          </div>
        );
      }

      function StatCard({ label, value, tone = 'positive' }) {
        const color = tone === 'positive' ? 'var(--color-success)' : 'var(--color-danger)';
        return (
          <div style={{ flex: 1, background: '#fff', borderRadius: 'var(--radius-md)', padding: 14, boxShadow: 'var(--shadow-card)' }}>
            <div style={{ fontSize: 11, color: 'var(--color-text-muted)', fontWeight: 'var(--weight-semibold)', marginBottom: 6 }}>{label}</div>
            <div style={{ fontSize: 16, fontWeight: 'var(--weight-black)', color }}>{value}</div>
          </div>
        );
      }

      const CATEGORY_COLORS = { income: 'var(--color-cat-income)', food: 'var(--color-cat-food)', shopping: 'var(--color-cat-shopping)', bills: 'var(--color-cat-bills)', transport: 'var(--color-cat-transport)' };
      function CategoryIcon({ type }) {
        const c = { width: 18, height: 18, viewBox: '0 0 20 20', fill: 'none' };
        if (type === 'income') return <svg {...c}><path d="M10 15V5M10 5l-4 4M10 5l4 4" stroke="#fff" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" /></svg>;
        if (type === 'food') return <svg {...c}><path d="M6 2v6M8 2v6M6 5h2M7 8v10" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" /><path d="M13 2c-1.2 0-2 1.5-2 4s.8 3 2 3v9" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" /></svg>;
        if (type === 'shopping') return <svg {...c}><path d="M5 7h10l-1 10.5H6L5 7Z" stroke="#fff" strokeWidth="1.5" strokeLinejoin="round" /><path d="M8 7a2 2 0 0 1 4 0" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" /></svg>;
        if (type === 'bills') return <svg {...c}><rect x="5" y="2.5" width="10" height="15" rx="1.2" stroke="#fff" strokeWidth="1.5" /><path d="M7.5 7h5M7.5 10h5M7.5 13h3" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" /></svg>;
        if (type === 'transport') return <svg {...c}><path d="M4 12.5l1.2-4.3A2 2 0 0 1 7.1 6.8h5.8a2 2 0 0 1 1.9 1.4l1.2 4.3" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" /><rect x="3" y="12.5" width="14" height="3" rx="1" stroke="#fff" strokeWidth="1.5" /><circle cx="6.5" cy="16" r="1.1" fill="#fff" /><circle cx="13.5" cy="16" r="1.1" fill="#fff" /></svg>;
        return null;
      }
      function TransactionRow({ name, category, meta, amount, positive, icon, showDivider = true }) {
        return (
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 0', borderBottom: showDivider ? '1px solid var(--divider)' : 'none' }}>
            <div style={{ width: 40, height: 40, borderRadius: '50%', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', background: CATEGORY_COLORS[icon] }}><CategoryIcon type={icon} /></div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 14, fontWeight: 'var(--weight-bold)', color: 'var(--color-text)' }}>{name}</div>
              <div style={{ fontSize: 12, color: 'var(--color-text-muted)', fontWeight: 'var(--weight-semibold)' }}>{category} · {meta}</div>
            </div>
            <div style={{ fontSize: 14, fontWeight: 'var(--weight-black)', color: positive ? 'var(--color-success)' : 'var(--color-danger)' }}>{amount}</div>
          </div>
        );
      }

      function GoalCard({ name, initials, color = 'var(--color-primary)', due, percent, saved, target }) {
        return (
          <div style={{ background: '#fff', borderRadius: 'var(--radius-lg)', padding: 16, boxShadow: 'var(--shadow-card)' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12 }}>
              <div style={{ width: 40, height: 40, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontWeight: 'var(--weight-black)', fontSize: 12, background: color }}>{initials}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 14, fontWeight: 'var(--weight-black)' }}>{name}</div>
                <div style={{ fontSize: 11, color: 'var(--color-text-muted)', fontWeight: 'var(--weight-semibold)' }}>{due}</div>
              </div>
              <span style={{ fontSize: 13, fontWeight: 'var(--weight-black)' }}>{percent}%</span>
            </div>
            <div style={{ height: 6, borderRadius: 3, background: '#EDEEF3', marginBottom: 8 }}><div style={{ width: percent + '%', height: 6, borderRadius: 3, background: color }} /></div>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, fontWeight: 'var(--weight-semibold)', color: 'var(--color-text-muted)' }}>
              <span>{saved} đã tiết kiệm</span><span>Mục tiêu {target}</span>
            </div>
          </div>
        );
      }

      function BudgetRow({ category, spent, limit, percent, color = 'var(--color-primary)' }) {
        return (
          <div style={{ marginBottom: 14 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, fontWeight: 'var(--weight-bold)', marginBottom: 6 }}>
              <span>{category}</span><span style={{ color: 'var(--color-text-muted)', fontWeight: 'var(--weight-semibold)' }}>{spent} / {limit}</span>
            </div>
            <div style={{ height: 6, borderRadius: 3, background: '#EDEEF3' }}><div style={{ height: 6, borderRadius: 3, width: percent + '%', background: color }} /></div>
          </div>
        );
      }

      function Demo() {
        const [masked, setMasked] = useState(false);
        return (
          <div style={{ display: 'flex', gap: 20, flexWrap: 'wrap' }}>
            <div style={{ width: 300, display: 'flex', flexDirection: 'column', gap: 14 }}>
              <BalanceCard balance="24.850.000 ₫" cardNumber="•••• 4821" expiry="09/28" masked={masked} onToggleMask={() => setMasked(!masked)} />
              <div style={{ display: 'flex', gap: 10 }}>
                <StatCard label="Thu nhập tháng này" value="+18.200.000 ₫" tone="positive" />
                <StatCard label="Chi tiêu tháng này" value="-6.350.000 ₫" tone="negative" />
              </div>
              <GoalCard name="Mua xe máy" initials="XM" color="#F2734A" due="Hạn: Th12/2026" percent={50} saved="15.000.000 ₫" target="30.000.000 ₫" />
            </div>
            <div style={{ width: 300, display: 'flex', flexDirection: 'column', gap: 14 }}>
              <div style={{ background: '#fff', borderRadius: 18, padding: '4px 16px', boxShadow: 'var(--shadow-card)' }}>
                <TransactionRow name="Lương tháng 8" category="Thu nhập" meta="Hôm nay" amount="+18.000.000 ₫" positive icon="income" />
                <TransactionRow name="Circle K" category="Ăn uống" meta="08:30" amount="-45.000 ₫" positive={false} icon="food" />
                <TransactionRow name="Shopee" category="Mua sắm" meta="Hôm qua" amount="-650.000 ₫" positive={false} icon="shopping" showDivider={false} />
              </div>
              <div style={{ background: '#fff', borderRadius: 18, padding: 16, boxShadow: 'var(--shadow-card)' }}>
                <BudgetRow category="Mua sắm" spent="650.000 ₫" limit="2.000.000 ₫" percent={33} color="#7C5CFC" />
                <BudgetRow category="Ăn uống" spent="134.000 ₫" limit="1.500.000 ₫" percent={9} color="#F2734A" />
              </div>
            </div>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
    </script>
    <script>
      const __code = document.getElementById('app-src').textContent;
      const __out = Babel.transform(__code, { presets: [['react', { runtime: 'classic' }]] }).code;
      (0, eval)(__out);
    </script>
  </body>
</html>
