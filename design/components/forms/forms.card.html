<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../styles.css" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        margin: 0;
        font-family: var(--font-sans);
        background: var(--color-bg);
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script id="app-src" type="text/plain">
      const { useState } = React;
      function SegmentedControl({ options, value, onChange }) {
        return (
          <div style={{ display: 'flex', gap: 6, background: '#EDEEF3', borderRadius: 10, padding: 4 }}>
            {options.map((opt) => {
              const active = opt === value;
              return <div key={opt} onClick={() => onChange(opt)} style={{ flex: 1, textAlign: 'center', padding: '9px 0', borderRadius: 10, cursor: 'pointer', background: active ? '#101828' : 'transparent', color: active ? '#fff' : '#8B93A7', fontWeight: active ? 700 : 600, fontSize: 13 }}>{opt}</div>;
            })}
          </div>
        );
      }
      function Demo() {
        const [v1, setV1] = useState('Tất cả');
        const [v2, setV2] = useState('Chi tiêu');
        return (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 16, maxWidth: 360 }}>
            <SegmentedControl options={['Tất cả', 'Thu nhập', 'Chi tiêu']} value={v1} onChange={setV1} />
            <SegmentedControl options={['Chi tiêu', 'Thu nhập']} value={v2} onChange={setV2} />
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
    </script>
    <script>
      const __code = document.getElementById('app-src').textContent;
      const __out = Babel.transform(__code, { presets: [['react', { runtime: 'classic' }]] }).code;
      (0, eval)(__out);
    </script>
  </body>
</html>
