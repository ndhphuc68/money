<!-- @dsCard group="Components" viewport="700x440" subtitle="BottomNav, SettingsList" name="Navigation" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../styles.css" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        margin: 0;
        font-family: var(--font-sans);
        background: var(--color-bg);
        padding: 20px;
        display: flex;
        gap: 24px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script id="app-src" type="text/plain">
      const { useState } = React;
      function NavIcon({ type, color }) {
        const c = { width: 22, height: 22, viewBox: '0 0 22 22', fill: 'none' };
        if (type === 'overview') return <svg {...c}><circle cx="11" cy="11" r="7.5" stroke={color} strokeWidth="1.8" /><circle cx="11" cy="11" r="2.5" fill={color} /></svg>;
        if (type === 'list') return <svg {...c}><rect x="3" y="5" width="16" height="2.4" rx="1.2" fill={color} /><rect x="3" y="10" width="16" height="2.4" rx="1.2" fill={color} /><rect x="3" y="15" width="10" height="2.4" rx="1.2" fill={color} /></svg>;
        if (type === 'target') return <svg {...c}><circle cx="11" cy="11" r="8" stroke={color} strokeWidth="1.8" /><circle cx="11" cy="11" r="3.5" stroke={color} strokeWidth="1.8" /></svg>;
        if (type === 'profile') return <svg {...c}><circle cx="11" cy="7.5" r="3.5" stroke={color} strokeWidth="1.8" /><path d="M3.5 19c1.3-4 4.3-6 7.5-6s6.2 2 7.5 6" stroke={color} strokeWidth="1.8" strokeLinecap="round" /></svg>;
        return null;
      }
      function NavItem({ item, active, onChange }) {
        const color = active ? '#2F6FED' : '#B4BACB';
        const textColor = active ? '#101828' : '#9AA1B4';
        return <div onClick={() => onChange(item.key)} style={{ cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, width: 56 }}><NavIcon type={item.icon} color={color} /><span style={{ fontSize: 10, fontWeight: 700, color: textColor }}>{item.label}</span></div>;
      }
      function BottomNav({ items, activeKey, onChange, onAdd }) {
        return (
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-around', padding: '10px 8px 26px', background: '#fff', borderTop: '1px solid var(--divider)', width: 340, borderRadius: 12 }}>
            {items.slice(0, 2).map((it) => <NavItem key={it.key} item={it} active={it.key === activeKey} onChange={onChange} />)}
            <div onClick={onAdd} style={{ cursor: 'pointer', width: 52, height: 52, borderRadius: '50%', background: '#101828', display: 'flex', alignItems: 'center', justifyContent: 'center', marginTop: -30, boxShadow: '0 8px 16px rgba(16,24,40,0.25)' }}><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 3v14M3 10h14" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" /></svg></div>
            {items.slice(2).map((it) => <NavItem key={it.key} item={it} active={it.key === activeKey} onChange={onChange} />)}
          </div>
        );
      }
      function SettingsList({ items }) {
        return (
          <div style={{ background: '#fff', borderRadius: 26, overflow: 'hidden', width: 300 }}>
            {items.map((item, i) => (
              <div key={item.label} style={{ display: 'flex', alignItems: 'center', minHeight: 52, padding: '0 16px', fontSize: 17, borderBottom: i < items.length - 1 ? '1px solid rgba(60,60,67,0.12)' : 'none' }}>
                <div style={{ width: 30, height: 30, borderRadius: 7, background: item.iconColor, marginRight: 12 }} />
                <div style={{ flex: 1 }}>{item.label}</div>
                <svg width="8" height="14" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke="rgba(60,60,67,0.3)" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" /></svg>
              </div>
            ))}
          </div>
        );
      }
      function Demo() {
        const [tab, setTab] = useState('overview');
        const items = [
          { key: 'overview', label: 'Tổng quan', icon: 'overview' },
          { key: 'transactions', label: 'Giao dịch', icon: 'list' },
          { key: 'goals', label: 'Mục tiêu', icon: 'target' },
          { key: 'profile', label: 'Cá nhân', icon: 'profile' },
        ];
        return (
          <React.Fragment>
            <BottomNav items={items} activeKey={tab} onChange={setTab} onAdd={() => {}} />
            <SettingsList items={[{ label: 'Thông tin cá nhân', iconColor: '#2F6FED' }, { label: 'Bảo mật & mật khẩu', iconColor: '#101828' }, { label: 'Trợ giúp', iconColor: '#7C5CFC' }]} />
          </React.Fragment>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
    </script>
    <script>
      const __code = document.getElementById('app-src').textContent;
      const __out = Babel.transform(__code, { presets: [['react', { runtime: 'classic' }]] }).code;
      (0, eval)(__out);
    </script>
  </body>
</html>
