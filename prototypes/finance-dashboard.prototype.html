<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Money — Design direction prototype</title>
  <style>
    /* PROTOTYPE ONLY: three dashboard directions, switch with ?variant=a|b|c */
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #13231f; background: #f5f7f4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button { font: inherit; cursor: pointer; }
    .shell { min-height: 100vh; padding: 28px 24px 120px; }
    .page { width: min(1120px, 100%); margin: auto; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:36px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-.04em; font-size:22px; }
    .brand-mark { width:32px; height:32px; border-radius:11px; display:grid; place-items:center; color:white; font-weight:900; }
    .profile { display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700; }
    .avatar { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:white; font-size:12px; }
    .eyebrow { font-size:12px; text-transform:uppercase; letter-spacing:.12em; font-weight:800; opacity:.62; }
    h1,h2,h3,p { margin-top:0; } h1 { font-size:clamp(30px,5vw,52px); line-height:1; letter-spacing:-.06em; margin:8px 0 12px; } h2 { font-size:22px; letter-spacing:-.04em; margin-bottom:16px; } h3 { font-size:15px; margin-bottom:7px; }
    .muted { opacity:.62; font-size:14px; }
    .grid { display:grid; gap:16px; } .grid-3 { grid-template-columns:repeat(3,1fr); } .grid-2 { grid-template-columns:1.25fr .75fr; }
    .card { border-radius:24px; padding:24px; } .metric { min-height:138px; } .metric-value { font-size:30px; font-weight:850; letter-spacing:-.06em; margin:14px 0 4px; } .trend { color:#22856b; font-size:12px; font-weight:800; }
    .chart { height:210px; position:relative; overflow:hidden; } .chart svg { width:100%; height:100%; } .legend { display:flex; gap:18px; font-size:12px; opacity:.68; margin-top:12px; } .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
    .rows { display:grid; gap:2px; } .row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid currentColor; border-color:color-mix(in srgb, currentColor 10%, transparent); } .row-left { display:flex; align-items:center; gap:11px; min-width:0; } .row-icon { width:34px; height:34px; border-radius:12px; display:grid; place-items:center; font-weight:800; font-size:13px; flex:none; } .row-title { font-weight:750; font-size:14px; } .row-sub { font-size:12px; opacity:.58; margin-top:3px; } .amount { font-weight:800; white-space:nowrap; }
    .progress { height:8px; border-radius:20px; overflow:hidden; background:color-mix(in srgb, currentColor 11%, transparent); } .progress span { display:block; height:100%; border-radius:inherit; }
    .budget-item { margin:18px 0 22px; } .budget-head { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:9px; } .budget-meta { display:flex; justify-content:space-between; font-size:11px; opacity:.58; margin-top:7px; }
    .nav { display:flex; gap:8px; padding:8px; border-radius:20px; margin-top:30px; } .nav button { border:0; padding:10px 14px; border-radius:14px; background:transparent; font-size:12px; font-weight:750; opacity:.65; } .nav button.active { opacity:1; }
    .switcher { position:fixed; z-index:5; left:50%; bottom:22px; transform:translateX(-50%); display:flex; align-items:center; gap:12px; padding:9px 13px; border-radius:999px; color:#fff; background:#12231f; box-shadow:0 12px 34px #0003; font-size:12px; } .switcher button { width:28px; height:28px; border:0; border-radius:50%; background:#ffffff1c; color:#fff; } .switcher strong { min-width:145px; text-align:center; }

    /* A — calm premium */
    body.a { background:#f5f7f4; color:#19342d; } .a .shell { background:radial-gradient(circle at 90% 0%, #e0efe6 0, transparent 32%); } .a .brand-mark { background:#287b67; } .a .avatar { background:#a46d4c; } .a .card { background:#fff; box-shadow:0 8px 30px #244d3b0d; border:1px solid #e1eae4; } .a .nav { background:#e9f0eb; } .a .nav button.active { background:#fff; color:#287b67; } .a .row-icon { background:#e4f1eb; color:#287b67; } .a .chart { background:#f7faf7; border-radius:18px; padding:8px; }
    /* B — dark fintech */
    body.b { background:#0d1216; color:#e9f2ef; } .b .shell { background:linear-gradient(135deg,#111a1e,#0d1216 52%); } .b .brand-mark { background:#b7f34a; color:#142000; } .b .avatar { background:#43525b; } .b .muted,.b .eyebrow { color:#aab9b4; } .b .card { background:#151e22; border:1px solid #2a393d; border-radius:12px; } .b .nav { background:#151e22; border:1px solid #2a393d; } .b .nav button.active { background:#b7f34a; color:#142000; } .b .row-icon { background:#233238; color:#b7f34a; border-radius:8px; } .b .trend { color:#b7f34a; } .b .chart { background:#10181c; border-radius:8px; padding:4px; }
    /* C — friendly coach */
    body.c { background:#fffaf4; color:#3d3029; } .c .shell { background:linear-gradient(140deg,#fff8ed,#fffaf4 58%,#eff8ec); } .c .brand-mark { background:#f17e62; border-radius:50%; } .c .avatar { background:#6ca86b; } .c .card { background:#fff; border:2px solid #f0e2d4; border-radius:30px; } .c .nav { background:#f8eadb; } .c .nav button.active { background:#f17e62; color:white; } .c .row-icon { background:#fff0dd; color:#d46a4d; border-radius:50%; } .c .trend { color:#6ca86b; } .c .chart { background:#fff7ed; border-radius:22px; padding:8px; }
    /* D — editorial ledger */
    body.d { background:#f1eee8; color:#25231f; } .d .shell { background:linear-gradient(115deg,#f1eee8 0,#f8f6f0 55%,#e7e3db); } .d .brand-mark { background:#25231f; border-radius:3px; } .d .avatar { background:#8f6651; border-radius:3px; } .d .card { background:transparent; border:0; border-radius:0; border-top:2px solid #25231f; padding:22px 0; } .d .nav { border-top:1px solid #25231f; border-bottom:1px solid #25231f; border-radius:0; padding:8px 0; } .d .nav button.active { background:#25231f; color:#f8f6f0; border-radius:3px; } .d .row-icon { background:#ded8cd; color:#25231f; border-radius:3px; } .d .chart { background:#e4e0d7; border-radius:0; padding:8px; } .d .grid-3 { grid-template-columns:1.4fr 1fr 1fr; }
    /* E — monochrome zen */
    body.e { background:#fafafa; color:#161616; } .e .shell { background:#fafafa; } .e .brand-mark { background:#161616; border-radius:50%; } .e .avatar { background:#a4a4a4; } .e .card { background:transparent; border:0; border-radius:0; padding:24px 0; border-bottom:1px solid #dedede; } .e .nav { background:#ededed; border-radius:999px; } .e .nav button.active { background:#161616; color:#fff; border-radius:999px; } .e .row-icon { background:#ededed; color:#161616; border-radius:50%; } .e .trend { color:#161616; } .e .chart { background:#f0f0f0; border-radius:999px; padding:12px; filter:grayscale(1); } .e .grid-3 { gap:32px; }
    /* F — premium bento modular */
    body.f { background:#eef1f7; color:#17213b; } .f .shell { background:radial-gradient(circle at 6% -4%,#cfdcff 0,transparent 28%),radial-gradient(circle at 100% 15%,#e1d6ff 0,transparent 24%),#eef1f7; } .f .page { width:min(1180px,100%); } .f .brand { letter-spacing:-.06em; } .f .brand-mark { background:linear-gradient(145deg,#536dff,#845cf2); border-radius:12px; box-shadow:0 8px 18px #536dff45; } .f .avatar { background:linear-gradient(145deg,#f1a76d,#e57c71); box-shadow:0 6px 14px #e57c7138; } .f h1 { font-size:clamp(36px,6vw,62px); line-height:.94; } .f .eyebrow { letter-spacing:.16em; color:#63718e; } .f .card { background:#ffffffbd; backdrop-filter:blur(18px); border:1px solid #ffffff; border-radius:26px; box-shadow:0 18px 45px #52638a18, inset 0 1px #ffffff; } .f .metric { min-height:154px; } .f .metric:first-child { background:linear-gradient(145deg,#526dff,#765bea); color:#fff; border:0; box-shadow:0 22px 42px #536dff3b; } .f .metric:first-child .eyebrow { color:#e5eaff; opacity:.8; } .f .metric:first-child .trend { color:#d9ffd7; } .f .metric:first-child .metric-value { font-size:42px; } .f .nav { background:#ffffffa8; border:1px solid #fff; box-shadow:0 8px 24px #52638a12; } .f .nav button { min-height:44px; } .f .nav button.active { background:#17213b; color:#fff; box-shadow:0 6px 12px #17213b26; } .f .row-icon { background:#edf0ff; color:#536dff; border-radius:12px; } .f .trend { color:#526dff; } .f .chart { background:linear-gradient(180deg,#f5f6ff,#edf0fa); border-radius:19px; padding:8px; color:#536dff; } .f .grid-3 { grid-template-columns:1.35fr .85fr .85fr; } .f .metric:first-child { grid-row:span 2; min-height:324px; display:flex; flex-direction:column; justify-content:center; } .f .grid-2 { grid-template-columns:1.1fr .9fr; } .f .progress { background:#e6eaf3; } .f .switcher { background:#17213b; }
    /* G — research-based premium indigo */
    body.g { background:#eef1f7; color:#17213b; } .g .shell { background:radial-gradient(circle at 0 0,#e2e8ff 0,transparent 30%),#eef1f7; } .g .page { width:min(1120px,100%); } .g .brand-mark { background:#536dff; border-radius:11px; } .g .avatar { background:#7c5cfc; } .g .eyebrow { color:#63718e; letter-spacing:.14em; } .g .card { background:#fff; border:1px solid #e1e6f0; border-radius:22px; box-shadow:0 10px 28px #17213b0c; } .g .metric:first-child { background:#536dff; color:#fff; border:0; box-shadow:0 16px 30px #536dff38; } .g .metric:first-child .eyebrow { color:#e9edff; } .g .metric:first-child .trend { color:#d9ffd7; } .g .metric:first-child .metric-value { font-size:40px; } .g .nav { background:#fff; border:1px solid #e1e6f0; box-shadow:0 8px 20px #17213b0a; } .g .nav button { min-height:44px; } .g .nav button.active { background:#17213b; color:#fff; } .g .row-icon { background:#e9edff; color:#536dff; border-radius:11px; } .g .trend { color:#218b6c; } .g .chart { background:#f5f6ff; border-radius:16px; padding:8px; color:#536dff; } .g .progress { background:#e7eaf1; } .g .budget-item:nth-child(2) .progress span { background:#218b6c !important; } .g .budget-item:nth-child(3) .progress span { background:#b86800 !important; } .g .budget-item:nth-child(4) .progress span { background:#c0393b !important; } .g .grid-3 { grid-template-columns:1.25fr .9fr .85fr; } .g .switcher { background:#17213b; }
    /* G reference board overrides: primary #281C9D, #5655B9, #A8A3D7, #F2F1F9 */
    body.g { background:#f2f1f9; color:#343434; } .g .shell { background:radial-gradient(circle at 0 0,#a8a3d733 0,transparent 30%),#f2f1f9; } .g .brand-mark { background:#281c9d; } .g .avatar { background:#5655b9; } .g .eyebrow { color:#898989; } .g .card { border-color:#e0e0e0; box-shadow:0 10px 28px #3629b712; } .g .metric:first-child { background:#281c9d; box-shadow:0 16px 30px #3629b712; } .g .metric:first-child .eyebrow { color:#f2f1f9; } .g .metric:first-child .trend { color:#52d5ba; } .g .nav { border-color:#e0e0e0; box-shadow:0 8px 20px #3629b712; } .g .nav button.active { background:#281c9d; } .g .row-icon { background:#f2f1f9; color:#281c9d; } .g .trend { color:#52d5ba; } .g .chart { background:#f2f1f9; color:#281c9d; } .g .progress { background:#e0e0e0; } .g .budget-item:nth-child(2) .progress span { background:#52d5ba !important; } .g .budget-item:nth-child(3) .progress span { background:#ffaf2a !important; } .g .budget-item:nth-child(4) .progress span { background:#ff4267 !important; } .g .switcher { background:#343434; }
    @media (max-width:700px) { .shell { padding:20px 16px 110px; } .topbar { margin-bottom:26px; } .grid-3,.grid-2 { grid-template-columns:1fr; } .metric { min-height:112px; } .card { padding:20px; } .switcher strong { min-width:112px; } }
  </style>
</head>
<body>
  <main class="shell"><div class="page" id="app"></div></main>
  <div class="switcher"><button id="prev" aria-label="Phong cách trước">←</button><strong id="variant-label"></strong><button id="next" aria-label="Phong cách sau">→</button></div>
  <script>
    const variants = { a: 'A · Calm premium', b: 'B · Dark fintech', c: 'C · Friendly coach', d: 'D · Editorial ledger', e: 'E · Monochrome zen', f: 'F · Bento modular', g: 'G · Research premium indigo' };
    const order = ['a','b','c','d','e','f','g'];
    const tx = [['☕','Cà phê sáng','Ăn uống','-45.000đ'],['↗','Lương tháng 8','Thu nhập','+32.000.000đ'],['⌂','Tiền thuê nhà','Nhà ở','-8.500.000đ'],['◉','Gói nghe nhạc','Định kỳ','-59.000đ']];
    const chart = `<svg viewBox="0 0 600 200" preserveAspectRatio="none" aria-label="Biểu đồ dòng tiền 6 tháng"><path d="M0 150 C80 128 90 145 150 102 S250 136 300 80 S395 112 445 58 S520 78 600 28" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M0 150 C80 128 90 145 150 102 S250 136 300 80 S395 112 445 58 S520 78 600 28 V200 H0Z" fill="currentColor" opacity=".07"/></svg>`;
    const rows = tx.map(x => `<div class="row"><div class="row-left"><span class="row-icon">${x[0]}</span><div><div class="row-title">${x[1]}</div><div class="row-sub">${x[2]} · Hôm nay</div></div></div><div class="amount">${x[3]}</div></div>`).join('');
    function render(key) {
      document.body.className = key; document.getElementById('variant-label').textContent = variants[key];
      document.getElementById('app').innerHTML = `<header class="topbar"><div class="brand"><span class="brand-mark">₫</span> money</div><div class="profile"><span>Xin chào, Minh</span><span class="avatar">MN</span></div></header>
      <section><div class="eyebrow">Tổng quan tháng 8</div><h1>Tiền của bạn,<br/>rõ ràng hơn.</h1><p class="muted">Cập nhật lần cuối: vừa xong · Dữ liệu an toàn trên thiết bị</p></section>
      <nav class="nav"><button class="active">Tổng quan</button><button>Giao dịch</button><button>Ngân sách</button><button>Mục tiêu</button></nav>
      <section class="grid grid-3" style="margin-top:16px"><div class="card metric"><div class="eyebrow">Số dư hiện tại</div><div class="metric-value">24.850.000đ</div><div class="trend">↑ 12,4% so với tháng trước</div></div><div class="card metric"><div class="eyebrow">Đã chi tháng này</div><div class="metric-value">7.150.000đ</div><div class="muted">Còn 18 ngày trong tháng</div></div><div class="card metric"><div class="eyebrow">Tỷ lệ tiết kiệm</div><div class="metric-value">38,2%</div><div class="trend">Mục tiêu: 30%</div></div></section>
      <section class="grid grid-2" style="margin-top:16px"><div class="card"><h2>Dòng tiền</h2><div class="chart">${chart}</div><div class="legend"><span><i class="dot" style="background:#63b89b"></i>Thu vào</span><span><i class="dot" style="background:#f17e62"></i>Chi ra</span><span style="margin-left:auto">Tháng 3 — Tháng 8</span></div></div><div class="card"><h2>Ngân sách</h2><div class="budget-item"><div class="budget-head"><span>Ăn uống</span><span>2.450.000đ / 4tr</span></div><div class="progress"><span style="width:61%;background:#f17e62"></span></div><div class="budget-meta"><span>Còn 1.550.000đ</span><span>61%</span></div></div><div class="budget-item"><div class="budget-head"><span>Di chuyển</span><span>780.000đ / 2tr</span></div><div class="progress"><span style="width:39%;background:#6ca86b"></span></div><div class="budget-meta"><span>Còn 1.220.000đ</span><span>39%</span></div></div><div class="budget-item"><div class="budget-head"><span>Mua sắm</span><span>1.920.000đ / 3tr</span></div><div class="progress"><span style="width:64%;background:#d9a441"></span></div><div class="budget-meta"><span>Còn 1.080.000đ</span><span>64%</span></div></div></div></section>
      <section class="card" style="margin-top:16px"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Giao dịch gần đây</h2><span class="muted">Xem tất cả →</span></div><div class="rows">${rows}</div></section>`;
    }
    function setVariant(key) { history.replaceState(null,'','?variant='+key); render(key); }
    let key = new URLSearchParams(location.search).get('variant') || 'a'; if (!variants[key]) key = 'a'; render(key);
    function cycle(delta) { const i = order.indexOf(key); key = order[(i + delta + order.length) % order.length]; setVariant(key); }
    document.getElementById('prev').onclick = () => cycle(-1); document.getElementById('next').onclick = () => cycle(1);
    document.addEventListener('keydown', e => { if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return; if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1); });
  </script>
</body>
</html>
